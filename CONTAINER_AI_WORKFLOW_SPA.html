    m1_p3: "接著是通訊層的連接器（Connector），扮演「外接的水電管線」：它負責在不同系統或平台之間牽線、傳遞資料，本身並不執行任何邏輯運算，而是安全地讓 AI 串接到外部世界，例如公司的 SQL 資料庫、Google Drive 或外部新聞 API。",
    m1_p4: "最關鍵、也是最容易被誤解的一層，是安全層的沙盒（Sandbox）。許多人直覺會把沙盒想像成「房子外圍的鐵絲網」，用來擋住外部入侵者；但這個比喻其實方向錯了——沙盒真正要處理的風險來自「內部」：AI 自己生成、尚未驗證的程式碼。因此更精確的比喻，是房子內部一間專門的抗爆隔離艙：AI 生成的程式碼會被限制在這個極低權限的房間裡執行，就算邏輯出錯甚至具有攻擊性，危險也會被鎖死在隔離艙內，不會波及核心系統。",
    m1_wrapup: "四層基礎設施由內而外分別是隔離層（容器）、能力層（套件與外掛）、通訊層（連接器）、安全層（沙盒）。容器界定邊界、套件與外掛提供能力、連接器負責對外連結、沙盒負責對內止損，四者分工明確、缺一不可，共同構成 AI 系統穩定且安全運作的基礎。",

    m2_nav: "2. Agent 雙小組",
    m2_title: "Agent 協作架構：雙小組制",
    m2_overview: "本模組介紹高階 AI Agent 如何依「目的」拆解出兩支獨立小組：負責讓程式碼能跑的技術實作小組，以及負責讓結論站得住腳的決策分析小組，兩者各自形成閉環，卻共用同一個沙盒環境執行與驗證。",
    m2_highlights: ["工程師 Subagent","測試員 Subagent","正方分析師","反方分析師","綜合仲裁者","自癒閉環","辯證推論"],
    m2_p1: "當我們使用 Claude Code 這類具備自我迭代能力的工具處理宏觀任務時，AI 不會只靠單一角色完成所有工作，而是在幕後拆解成不同的 Subagent（子代理人）團隊協同運作。第一支是技術實作小組（Engineering Squad），由工程師與測試員兩個角色組成：工程師負責理解需求與上下文，撰寫對應的自動化腳本或分析程式碼；測試員則負責把程式碼丟進沙盒執行，捕捉報錯訊息，並回饋給工程師修正。兩者形成「寫 Code → 報錯 → 自我修正 → 重新執行」的自癒閉環，一直運作到程式成功為止，過程完全不需要驚動使用者。",
    m2_p2: "但光有技術實作小組還不夠。原始知識庫的工作流第 4 步驟曾提到「正反方觀點在數據模擬中進行辯證分析與推論」，這其實暗示需要另一支完全不同性質的團隊——決策分析小組（Analyst Squad）。這支小組不負責寫程式，而是針對「數據代表的意義」進行辯證：正方分析師從技術可行性與市場機會角度，論證數據的正面意義；反方分析師則從風險、時程延遲、商業衝擊角度提出質疑與反例；最後由綜合仲裁者彙整雙方論點，收斂成一個附帶信心水準的可執行結論。",
    m2_p3: "值得注意的是，兩支小組雖然目的不同，卻共用同一個沙盒環境來執行與驗證：技術實作小組驗證的是「程式碼能不能跑」，決策分析小組驗證的是「結論站不站得住腳」。把這兩種閉環分開定義，能避免我們誤以為「AI 自動生成程式碼」與「AI 自動做出商業判斷」是同一件事——前者是工程問題，後者是判斷力問題，需要不同角色與不同驗收標準。",
    m2_wrapup: "AI Agent 的高階協作並非單一角色包辦一切，而是依目的拆成兩支小組：技術實作小組（工程師＋測試員）形成程式碼自癒閉環；決策分析小組（正方＋反方＋綜合仲裁者）形成辯證推論閉環。兩者共用沙盒作為驗證場域，但驗收標準完全不同，這正是原始知識庫容易被忽略、卻是本次修訂補上的關鍵角色缺口。",

    m3_nav: "3. 五步驟工作流",
    m3_title: "標準工作流 SOP：五步驟",
    m3_overview: "本模組把四層基礎設施與兩支 Agent 小組串成一條完整的情報產出流水線：從環境初始化、工具載入、安全牽線資料，到沙盒驗證與辯證，最後產出 BI 圖表與決策建議。",
    m3_highlights: ["環境初始化","工具與技能載入","安全資料牽線","沙盒驗證與辯證","終端輸出"],
    m3_p1: "第一步是環境初始化，對應容器概念：Claude Code 以目前的專案目錄為邊界，啟動一個獨立運作的邏輯容器環境，確保專案資料與本機系統安全隔離。這一步沒有牽涉任何 Agent 小組，純粹是基礎設施的建立。",
    m3_p2: "第二步是工具與技能載入，對應套件與外掛：AI 會自主檢視任務需求，下載資料分析、網頁爬蟲等套件，並載入處理特定格式（如 PDF 解鎖、多模態視覺）的外掛工具，讓後續步驟具備完整的執行能力。第三步則是安全資料牽線，對應連接器：透過 API 連接器或檔案系統連接器，定時抓取設定主題的最新新聞資料，並與 knowledge_base 資料夾下累積的歷史知識庫進行差異比對，產出每日晨報摘要素材。",
    m3_p3: "第四步是整條工作流的核心，對應沙盒，也是兩支 Agent 小組真正登場的階段：技術實作小組（工程師＋測試員）撰寫並跑通評估用的科學數據模型；決策分析小組（正方＋反方＋綜合仲裁者）則在沙盒的數據模擬結果上，針對新舊數據進行辯證分析與推論。即便程式碼邏輯有誤、或推論一度出現偏差，危險與錯誤都會被鎖死在沙盒內，不會波及核心系統。",
    m3_p4: "第五步是終端輸出，這一步刻意不對應任何一個基礎設施概念，因為它是前四層共同服務的最終目的：沙盒驗證成功後，AI 將數據導出，自動渲染成網頁 BI 趨勢圖表，並綜合決策分析小組的辯證結論，在終端機輸出『建議決策行動』與『應持續追蹤議題』。沒有這一步的產出，前面的隔離、賦能、連結、驗證都失去意義。",
    m3_wrapup: "五步驟工作流依序是：環境初始化（容器）→ 工具與技能載入（套件／外掛）→ 安全資料牽線（連接器）→ 沙盒驗證與辯證（技術與分析雙小組）→ 終端輸出（BI 圖表與決策建議）。前四步是基礎設施逐層搭建的過程，第五步則是整條流水線唯一不對應基礎設施、卻是真正創造價值的產出目標。",

    m4_highlights: ["架構語意","Vibe Coding","完整版指令","精簡版指令","主題替換"],
    m4_p1: "使用 Claude Code 這類高階 Agent 時，最常見的誤區是鉅細靡遺地描述「該怎麼寫爬蟲」「該用哪個圖表函式庫」——這其實是把原本該由 AI 自主決定的實作細節，錯誤地丟回給使用者承擔。真正有效率的做法是 Vibe Coding：只描述你要的『架構語意』與『產出目標』，把套件選型、程式碼撰寫、除錯這些細節，交給工程師與測試員這兩個 Subagent 自行處理。",
    m4_p2: "完整版指令範本會明確標註每一句對應到哪一層概念或哪一支 Agent 小組：第一句對應連接器，要求抓取新聞並比對歷史知識庫；第二句對應決策分析小組，要求正反方辯證並收斂結論；第三句對應沙盒與技術實作小組，要求所有驗證腳本在沙盒中安全執行並自我修正；第四句對應終端輸出，要求產出 BI 圖表與決策建議。把指令拆成四句、各自對應一個概念或角色，可以大幅降低 AI 誤解需求的機率。",
    m4_p3: "精簡版指令範本則把四句話濃縮成一句話，適合在已經熟悉這套架構語意之後，快速觸發同樣的工作流。無論是完整版或精簡版，核心技巧都是一樣的：把主題放進方括號 [主題] 的位置替換掉即可，不需要每次重新設計整套流程——因為容器、套件、連接器、沙盒、雙小組、五步驟工作流，本來就是一套可以重複套用的固定架構。",
    m4_wrapup: "向高階 AI Agent 下達指令的關鍵，不在於描述實作細節，而在於用四層基礎設施與雙 Agent 小組的『架構語意』表達你要的產出目標。完整版指令逐句對應概念與角色，精簡版指令則是同一套邏輯的快速觸發版本；兩者共用同一個原則：只替換主題，架構本身可重複套用。",

      { front:"精簡版指令", back:"把完整版四句話濃縮為一句話，適合熟悉架構後快速觸發同樣工作流。" },

    m5_nav: "5. Agent 解剖學",
    m5_title: "Agent 解剖學：四件套、Skill 與 Subagent",
    m5_overview: "前四個模組從「使用者」視角理解工作流；本模組切換到「建造者」視角：一個 Agent 由哪四個元件組成？Skill 與 Subagent 有什麼差異？Agent 又可以從哪些地方被創造出來？理解這些，你就能從「使用 AI 的人」升級為「打造 AI 團隊的人」。",
    m5_highlights: ["Agent 四件套","Vibe Coding","Skill＝流程手冊","Subagent＝職務說明書","相對關係","Claude Agent SDK"],
    m5_p1: "任何一個 Agent，拆開來看都是四樣東西的組合：一顆腦袋（底層模型）、一組能呼叫的工具（檔案讀寫、終端機、瀏覽器、搜尋）、一份規範角色與行為的職務說明書（系統提示詞），以及一個讓它「行動→觀察結果→再行動」反覆執行的迴圈（harness）。四者湊齊，這個角色就能自己做事、自己修正——這就是 Agent 與單純聊天模型的分水嶺。",
    m5_p2: "Vibe Coding 與 Agent 是兩個不同層次的概念：Agent 是「誰在做」，Vibe Coding 是「你怎麼跟它說」——只描述目標與架構語意，把實作細節交給 Agent 自主決定。你可以擁有 Agent 卻不 Vibe Coding（逐行指定寫法），也可以 Vibe Coding 卻沒有真正的 Agent（單純與聊天模型對話）。兩者搭配，才是完整的協作模式。",
    m5_p3: "Skill 與 Subagent 都是把「臨時的 Vibe Coding」固化成「可重複觸發的資產」，但性質不同：Skill 是一本流程手冊（SOP），動詞式地教 Agent「這種任務該怎麼做」；Subagent 則是一張職務說明書，名詞式地定義「這個角色是誰、能用哪些工具、用哪顆腦袋」。手冊需要有人來執行，職務說明書則直接聘僱了一位新員工——兩者常常搭配使用：手冊裡指定某個步驟交給某位員工。",
    m5_p4: "Agent 可以從四個地方被創造出來：（一）系統內建的預設員工，如負責唯讀搜尋的 Explore、負責規劃的 Plan；（二）自訂職務卡——在 .claude/agents/ 資料夾放一份 Markdown 檔（開頭 YAML 定義名稱、職責、工具權限、模型，底下是系統提示詞），貼上佈告欄即完成聘僱；（三）臨時外包——當場口頭交代一件事，做完即散，不留常駐角色；（四）程式化人資系統——用 Claude Agent SDK 在自己的應用程式裡批量定義。最後記住：Agent 與 Subagent 不是兩個物種，而是同一種生物的相對位置——直接面對使用者的叫主 Agent（總機），被指派任務、做完回報、用完即忘的叫 Subagent（員工）；換個位置，身份就換。",
    m5_wrapup: "Agent＝模型＋工具＋提示詞＋迴圈的四件套組合；Vibe Coding 是與它協作的高階語言。Skill 把「怎麼做」固化成流程手冊，Subagent 把「誰來做」固化成職務說明書，兩者都是可重複觸發的資產。Agent 的創造來源有四：內建員工、自訂職務卡、臨時外包、SDK 程式化定義；而 Agent 與 Subagent 的差別不在本質，在於「誰在指揮誰」的相對位置。",
    m5_terms: [
      { front:"Agent 四件套", back:"模型（腦袋）＋工具（手腳）＋系統提示詞（職務說明）＋執行迴圈（工作節奏），四者齊備才是 Agent。" },

      { front:"Skill（流程手冊）", back:"動詞式資產：教 Agent 某類任務的做法與步驟，被觸發後載入情境，本身不會動。" },
      { front:"Subagent（職務說明書）", back:"名詞式資產：定義一個常駐角色的職責、工具權限與模型，等於聘僱一位新員工。" },
      { front:".claude/agents/", back:"自訂 Subagent 的安裝位置：一份 YAML＋系統提示詞的 Markdown 檔即完成聘僱。" },
      { front:"臨時 Agent", back:"當場交辦、做完即散的一次性外包，不需要事先寫職務卡。" },

    m5_q: [
      { q:"Agent 四件套指的是哪四樣元件的組合？", opts:["模型、工具、系統提示詞、執行迴圈","容器、套件、連接器、沙盒","理論家、實務家、批判家、仲裁者","Skill、Subagent、SDK、終端機"], ans:_A0, exp:"Agent＝腦袋（模型）＋手腳（工具）＋職務說明（系統提示詞）＋工作節奏（執行迴圈），四者齊備才能自主行動與修正。" },

      { q:"在 .claude/agents/ 放一份含 YAML 與系統提示詞的 Markdown 檔，等同於什麼動作？", opts:["刪除一個舊員工","聘僱一位常駐的 Subagent 員工","啟動沙盒環境","發布網頁到 GitHub Pages"], ans:_A1, exp:"這份檔案就是職務說明卡：名稱、職責描述、工具權限、模型都定義好，貼上佈告欄即完成聘僱，之後可被主 Agent 派工。" },

      { q:"「可以有 Agent 卻不 Vibe Coding」是什麼意思？", opts:["這種情況不存在","使用 Agent 時仍逐行指定實作細節，未把決策交給 AI","代表 Agent 故障了","代表只使用免費模型"], ans:_A1, exp:"Vibe Coding 是互動風格而非工具本身：即使用了 Claude Code 這類 Agent，若每行程式碼都親自指定寫法，就不是 Vibe Coding 的精神。" }

    m6_nav: "6. 審查代理人實戰",
    m6_title: "實戰案例：審查代理人系統設計",
    m6_overview: "本模組用一個真實建置並實測通過的系統——多視角審查代理人（Review Agent）——示範前五個模組的概念如何組裝成可運作、可擴充、可跨平台的 Agent 團隊：三位常駐審查員工、一位查核後勤、一本總機手冊，以及五個關鍵設計決策。",
    m6_highlights: ["角色與規準解耦","Full／Lite 雙模式","查核閉環","知識可攜","遺留資產治理"],
    m6_p1: "需求：審查四類內容（量化論文、質性論文、財務策略報告、總經市場報告），且每份文件都要從理論、實務、批判風險三個立場檢視。架構解法是四層：總審查官（主 Agent）負責分類與派工；三位視角審查員（理論家、實務家、批判家）是用職務說明書聘僱的常駐 Subagent，只有唯讀工具；查核員是共用後勤，獨享搜尋與重算工具；最後由總審查官綜合仲裁產出報告。",
    m6_p2: "決策一：角色與規準解耦。不要為「4 種內容 × 3 種視角」建 12 個員工——只聘 3 位角色固定的審查員，把內容差異全部封裝進 4 份規準檔（rubric）。新增審查領域時，寫一份新規準文件即可，任何角色都不用動。這是整套系統可擴充性的來源。",
    m6_p3: "決策二：批評必須可查核——審查員只能「標記」可疑宣稱，由查核員實際用搜尋與重算驗證，判定 CONFIRMED／REFUTED／UNVERIFIABLE 且必附來源；這是沙盒驗證精神的延伸：主張經過工具驗證才算數。決策三：Full／Lite 雙模式——Full 用多 Subagent 平行審查（成本約 5-8 倍，用於定稿），Lite 在單一情境內依序扮演三角色（日常快查）；同一套知識、兩個檔位。",
    m6_p4: "決策四：知識可攜、接線各平台——角色定義、規準、SOP、報告模板全部是純 Markdown（core/，唯一事實來源）；各平台只留一層薄接頭（adapters/）：Claude Code 能跑 Full 模式，ChatGPT 與 Gemini 因為沒有多 Subagent 機制只能跑 Lite。決策五：遺留資產治理——新系統與既有的專用審查 skill 分流共存而非立即淘汰，等新系統累積實戰紀錄後，再把舊 skill 改造成新架構上的領域擴充包。系統上線前用一份刻意埋錯的樣本報告做煙霧測試：三位審查員分工零重複地抓出各自領域的缺陷，查核員以公開來源反駁了三條關鍵宣稱——這就是整套架構的驗收方式。",
    m6_wrapup: "審查代理人系統示範了把概念組裝成真實系統的完整路徑：四層架構分派角色、角色與規準解耦保證擴充性、查核閉環守住事實底線、Full／Lite 雙模式平衡成本與品質、core／adapters 分離實現跨平台、遺留治理確保新舊系統平順過渡。設計原則的價值在於：擴充新領域從「重建系統」變成「寫一份文件」。",

    m6_q: [
      { q:"審查系統為何只建 3 個角色、而不是「4 內容 × 3 視角」的 12 個 Subagent？", opts:["因為預算不足","因為角色與規準解耦：角色固定，內容差異封裝進規準檔","因為平台最多只允許 3 個","因為審查不需要分視角"], ans:_A1, exp:"3 位審查員的「心態」固定不變，內容類型的差異全部由規準檔參數化；新增領域只需寫一份新文件，這是可擴充性的來源。" },
      { q:"查核閉環中，審查員與查核員的分工是？", opts:["審查員自行上網查證每條宣稱","查核員負責撰寫審查意見","審查員只標記可疑宣稱，查核員用搜尋與重算驗證並附來源","兩者做完全相同的事以互相備援"], ans:_A2, exp:"審查員專注判讀文件、標記可疑處；查核員獨享搜尋與重算工具，實際驗證後給出 CONFIRMED/REFUTED/UNVERIFIABLE 判定。" },
      { q:"為什麼 ChatGPT 與 Gemini 網頁版只能跑 Lite 模式？", opts:["因為它們沒有多 Subagent 平行機制","因為它們不支援 Markdown","因為規準檔案太大無法上傳","因為授權費用太高"], ans:_A0, exp:"Full 模式需要真正平行、彼此獨立的多個 Subagent；網頁版聊天工具只能在單一情境內依序扮演角色，即 Lite 模式。" },
      { q:"core/ 與 adapters/ 的分工原則是？", opts:["core 放程式碼、adapters 放文件","知識可攜（core 純 Markdown 唯一事實來源）、接線各平台（adapters 薄接頭）","core 給教師使用、adapters 給學生使用","兩者內容相同，互為備份"], ans:_A1, exp:"角色、規準、SOP 都是純文字放在 core/，到任何平台都能用；各平台只需要一層薄薄的接線設定。" },
      { q:"對既有的專用審查 skill，系統採取什麼治理策略？", opts:["立即全部刪除以避免混亂","分流共存，待新系統實戰驗證後再改造為領域擴充包","改名後隱藏起來","轉為付費功能"], ans:_A1, exp:"舊 skill 含新系統沒有的領域知識且久經實戰；正確做法是共存分流，等新系統證明自己後再逐步遷移，而非立即淘汰。" }
    ],

    m7_nav: "7. 無人值守實戰",
    m7_title: "實戰案例：Heartbeat 與無人值守收件匣",
    m7_overview: "前一模組把審查系統建了起來；本模組解決「誰來按按鈕」的問題——用 heartbeat（心跳）讓系統在開機後自動接收檔案、自動審查、自動產出報告，並示範無人值守自動化最關鍵的兩件事：安全設計與對抗性驗收。",
    m7_highlights: ["Heartbeat 心跳","零成本偵測","確定性程式碼 vs AI","收件即歸檔","縱深防禦","Fail-closed","靜默失敗與可觀測性"],
    m7_p1: "Heartbeat 的觸發設計首先要回答「電腦需不需要一直開著」——答案是不需要。排程器設兩個觸發器：登入後延遲 5 分鐘（留時間給雲端同步關機期間累積的上傳）與每日早晨備援；臨時想檢查則有桌面捷徑、口令、排程指令三種手動方式。收件端用 Dropbox File Request：上傳者不需帳號、看不到資料夾內容、也刪不了任何檔案——誤刪風險從「事後救援」變成「機制免疫」。",
    m7_p2: "整套系統最重要的分工原則是：「確定性程式碼做搬運，AI 只做判斷」。偵測新檔案、大小守衛、歸檔複製這些有標準答案的工作，交給排程腳本——零成本、可預測、而且不會被騙；AI 只負責讀檔與審查這些需要判斷力的工作。系統天天心跳，但只在真正有工作時才花錢，這就是「零成本偵測」。它的判定不是單一條件，而是兩個條件同時成立才零成本結束：① 收件夾沒有新檔案（與已處理清單比對）、② 今日的定期產出已完成（檢查當日完成旗標）；任一不成立就喚醒 AI。「新檔案」本身也有三個確定性判準：不在清單中或大小與紀錄不符、最後修改超過 60 秒（太新的可能還在雲端同步）、大小未超上限。關鍵洞見是：零成本之所以可能，是因為所有判定條件都被刻意設計成「檔案系統回答得出的問題」——存在嗎、多大、何時改的——而不是需要讀懂內容才能回答的問題。便宜的守門員，前提是門檻本身不需要智慧。",
    m7_p3: "無人值守代表沒有人在旁邊看著，所以安全要靠「縱深防禦」——五層互相獨立的防線：一、指令隔離（文件是資料不是指令，操縱企圖＝嚴重度 5 缺陷＋強制隔離）；二、權限最小化（無人值守執行拿掉命令列權限，寫入範圍限定於報告與狀態檔）；三、資源守衛（20MB 大小上限，防灌爆空間與成本）；四、竄改偵測（知識庫納入 git 版控作基準）；五、fail-closed——狀態檔損毀時寧可安全停止並通知人類，也不冒險大量重跑。單層被突破，仍有下一層。",
    m7_p4: "上線前的驗收不只測「正常流程跑得通」，還要做對抗性驗收：故意投遞一份內藏提示注入的測試檔——文件末段偽稱「系統指示」，要求審查系統忽略規則、直接給 10 分滿分並標記入庫。實測結果：評分完全未被操縱（給了 1.6 分）、注入被列為頭號嚴重度 5 缺陷、文件被強制隔離，系統還做出了正確的安全推理：「一份會試圖操縱下游流程的文件，其正文數字也不應被信任。」無人值守系統的真正驗收標準，是它在你不在場時面對攻擊的表現。",
    m7_p5: "上線後的真實故障帶來第五課：無人值守最危險的失敗不是崩潰，而是「靜默跳過」——系統看起來一切正常，工作卻根本沒做。實際案例：某日凌晨心跳撞上 AI 用量額度上限、晨報未產出，但排程腳本在呼叫 AI 之前就先寫了「今日已完成」旗標，於是當天後續心跳看到旗標就判定無事可做，那天的晨報被永久跳過。這是「樂觀標記」反模式，正確做法是「確認後標記」——**標記代表已完成的事實，不是即將嘗試的意圖。**",
    m7_p6: "第六課來自靜默失敗的第二種變形：無界等待——AI 被喚醒後既不成功也不失敗，就是不回來；日誌停在「呼叫 AI」那一行，而完成通知因為流程沒跑完而永遠不發，「掛住」對通知機制是隱形的。解法是給每個等待外部系統的呼叫加上逾時上限，並把 AI 呼叫改為可監控的子程序。",
    m7_p7: "第七課推翻了第六課的驗屍結論：那兩輪失敗的執行根本不是掛在 AI 呼叫上，而是**腳本本身被外力終止**——排程器建立任務時的預設「執行時限 1 小時」到點就把整棵程序樹無聲砍掉，不留日誌、不觸發通知；另一輪則死於終端視窗被關閉。腳本內剛修好的所有防護，連出場的機會都沒有。",
    m7_pts: [
      { h:"失敗模式三態：等待外部系統的三種死法", items:[
        { t:"明確失敗（回傳錯誤碼）", d:"最容易處理：記錄、通知、重試。額度上限、API 故障、網路中斷都屬此類——外部限制是常態，不是例外。" },
        { t:"假裝成功（樂觀標記）", d:"動作之前先寫「已完成」，失敗後當日被視為完成而永久跳過（fail-open）。對策：確認產物確實存在才寫標記，失敗就不寫、下次自動重試。" },
        { t:"掛住不回（無界等待）", d:"既不成功也不失敗，通知永遠不發。對策：逾時上限＋可監控子程序＋輸出先落獨立檔案留現場證據，逾時後走 fail-closed 重試路徑。" }
      ]},
      { h:"可觀測性的三道關卡", items:[
        { t:"通知是機制，不是便利功能", d:"無人值守的完整條件＝自動執行＋失敗自動重試＋結果主動告知。缺最後一項，系統只是「你以為它在跑」。" },
        { t:"通知內容要報實際落地的產物", d:"檢查檔案是否真的存在，而不是轉述 AI 說自己完成了——與審查系統「批評必須可查核」是同一種懷疑論，只是對象換成自己的系統。" },
        { t:"訊號發出 ≠ 訊號被接收", d:"25 秒自動關閉的彈窗，主人不在螢幕前就等於沒發。改為脫離程序顯示、永不自動關閉——可觀測性鏈的終點是「被人接收」。" }
      ]},
      { h:"殺手在系統外層：三個通則", items:[
        { t:"內層防護觀測不到自己的死亡", d:"腳本上面的每一層（排程器、容器、CI 執行器、作業系統）都有自己的殺手開關。盤點防護時要問：我的上層會怎麼殺我？死了會留下什麼痕跡？" },
        { t:"分層逾時的順序原則", d:"會觀測、會通知、會重試的內層上限，必須短於只會無聲砍樹的外層上限（本例內層 45 分鐘 < 外層 2 小時）。順序反了，內層守衛永遠等不到出場。" },
        { t:"沒驗證過的預設值就是還沒引爆的地雷", d:"1 小時時限存在一週都沒事（正常執行 15–25 分鐘），首次白天補跑拉長時間才觸線——低機率條件會引爆潛伏多日的設定地雷。" }
      ]},
      { h:"互鎖時間：兩個時間值疊在一起會怎樣", items:[
        { t:"矛盾", d:"鎖定失效門檻 30 分鐘、逾時上限 45 分鐘——第 31 分鐘起別的心跳會判定鎖已失效而闖入，與還活著的執行雙重執行。" },
        { t:"解法與通則", d:"等待期間定期刷新鎖定檔。通則：系統裡任何兩個以時間為條件的機制，都要檢查它們的時間值疊在一起時會發生什麼。" }
      ]}
    ],
    m7_wrapup: "Heartbeat 讓 agent 系統從「工具」升級為「服務」：開機即接手、無事零成本、有事自動處理、風險自動隔離。本模組的六個原則——確定性程式碼與 AI 分工、零成本偵測、收件即歸檔、縱深防禦、fail-closed（含標記時機與逾時上限）、結果主動告知——不限於審查系統，適用於任何無人值守的 AI 自動化；而系統的真正驗收，是它在你不在場時面對意外與攻擊的表現，而且你要能知道它出過什麼事。",
    m7_terms: [
      { front:"Heartbeat 心跳", back:"排程喚醒機制：agent 不等人開口，按節奏醒來檢查有無新工作；可綁定開機、定時或手動觸發。" },
      { front:"零成本偵測", back:"確定性腳本先判斷「有沒有工作」，沒有就直接結束——AI 完全不被喚醒、不花一毛錢。" },
      { front:"零成本的兩個條件", back:"①收件夾無新檔案 且 ②今日產出已完成——兩者同時成立才零成本結束，任一不成立就喚醒 AI。" },
      { front:"「新檔案」判準", back:"不在已處理清單或大小不符、修改超過 60 秒（避開同步中）、未超大小上限——三者皆為確定性檢查。" },
      { front:"門檻不需要智慧", back:"零成本的前提是判定條件都能由檔案系統回答（存在／大小／時間），一旦需要 AI 讀懂內容，零成本承諾即破。" },
      { front:"無界等待", back:"靜默失敗第二變形：呼叫既不成功也不失敗、就是不回來——完成通知因流程沒跑完而永遠不發，掛住對它隱形。" },
      { front:"逾時上限", back:"可監控子程序＋超時殺整個程序樹＋輸出先落獨立檔案留證據＋逾時不寫旗標走重試路徑；等待期間刷新鎖定檔防雙重執行。" },
      { front:"失敗模式三態", back:"明確失敗→記錄通知重試；假裝成功→確認後標記；掛住不回→逾時上限。三態俱全，各有對策。" },
      { front:"殺手在系統外層", back:"腳本上面的每一層（排程器、容器、CI、OS）都有殺手開關；內層防護觀測不到自己的死亡——要問「上層會怎麼殺我？」" },
      { front:"分層逾時順序原則", back:"會觀測、通知、重試的內層上限必須短於只會無聲砍樹的外層上限；順序反了，內層守衛永遠等不到出場。" },
      { front:"通知的最後一哩", back:"25 秒自動關閉的彈窗＝沒人在就等於沒發。可觀測性鏈的終點不是「訊號發出」，而是「訊號被人接收」。" },
      { front:"確定性程式碼 vs AI", back:"有標準答案的搬運工作（偵測、複製、守衛）交給程式碼；需要判斷的工作（審查、分流）才交給 AI。" },
      { front:"收件即歸檔", back:"處理前先複製到上傳者碰不到的封存區，任何後續意外都有不可變副本可回溯。" },
      { front:"File Request", back:"Dropbox 的只上傳機制：上傳者不需帳號、看不到內容、刪不了檔案——機制性根治誤刪。" },
      { front:"縱深防禦", back:"多層互相獨立的防線（指令隔離、權限最小化、資源守衛、版控基準、fail-closed），單層被突破仍有下一層。" },
      { front:"Fail-closed", back:"狀態異常時寧可安全停止並通知人類，也不冒險繼續；與 fail-open（出錯就全部重來）相對。" },
      { front:"對抗性驗收", back:"用刻意的攻擊樣本（如提示注入）測試系統；通過標準是攻擊被偵測、被拒絕、被記錄。" },
      { front:"靜默失敗", back:"無人值守最危險的失敗模式：系統看起來正常、工作卻沒做，且無人知情。" },
      { front:"樂觀標記反模式", back:"在動作之前就寫「已完成」旗標；一旦失敗，當日被視為完成而永久跳過（fail-open）。" },
      { front:"確認後標記", back:"檢查產物確實存在才寫旗標；失敗不寫、下次自動重試——標記是事實，不是意圖。" },
      { front:"完成通知＝可觀測性", back:"通知不是便利功能，而是讓人知情的機制；內容須報實際落地的產物，不是轉述 AI 的自述。" }
    ],
    m7_q: [
      { q:"「確定性程式碼做搬運，AI 只做判斷」的主要理由是？", opts:["程式碼寫起來比較快","搬運工作有標準答案：交給腳本零成本、可預測、不會被騙，AI 留給需要判斷力的工作","AI 沒有能力複製檔案","為了減少程式碼行數"], ans:_A1, exp:"偵測、複製、守衛這類工作有唯一正確做法，用確定性腳本執行既省成本又不受提示注入影響；AI 的價值在需要判斷力的審查與分流。" },
      { q:"「零成本偵測」指的是什麼？", opts:["AI 提供免費的檢查服務","排程腳本先偵測有無新檔案，沒有就直接結束，AI 根本不被喚醒","偵測過程不耗電","使用雲端免費方案"], ans:_A1, exp:"心跳每天都跳，但偵測由零成本的腳本完成；只有真正有新工作時才喚醒 AI，因此空轉日的成本是零。" },
      { q:"心跳要「零成本結束」必須滿足哪些條件？", opts:["只要收件夾沒有新檔案就夠了","收件夾無新檔案 **且** 今日的定期產出已完成，兩者同時成立","只要今天已經跑過一次心跳","只要使用者沒有手動觸發"], ans:_A1, exp:"兩個條件缺一不可：若晨報尚未產出（當日旗標不存在），即使沒有新檔案也會喚醒 AI——這正是失敗後能自動重試的原因。" },
      { q:"為何零成本偵測的判定條件都設計成「檔案系統回答得出的問題」？", opts:["因為程式設計師偷懶","因為一旦判定需要 AI 讀懂內容才能決定，零成本的承諾就破了","因為檔案系統比 AI 準確","因為這是作業系統的規定"], ans:_A1, exp:"存在嗎、多大、何時改的——這些都能零成本回答；便宜的守門員，前提是門檻本身不需要智慧。" },
      { q:"「無界等待」（AI 呼叫掛住不回）為何對完成通知機制隱形？", opts:["因為通知功能被關閉了","因為通知只在流程跑完才發，掛住的執行永遠到不了發通知那一步","因為 AI 攔截了通知","因為日誌檔已滿"], ans:_A1, exp:"掛住既不成功也不失敗，流程停在等待中——所以要用逾時上限強制讓流程走完，才輪得到通知與重試機制上場。" },
      { q:"逾時上限設 45 分鐘、而鎖定失效門檻是 30 分鐘，會產生什麼問題？如何解？", opts:["沒有問題，兩者互不相干","第 31 分鐘起其他心跳會判定鎖已失效而闖入、造成雙重執行；解法是等待期間定期刷新鎖定檔","逾時永遠不會觸發","鎖定檔會被自動刪除"], ans:_A1, exp:"兩個以時間為條件的機制疊在一起就可能矛盾——通則是：檢查它們的時間值疊加時會發生什麼。" },
      { q:"腳本內的逾時與通知防護都建好了，為何排程器砍掉執行時仍然什麼紀錄都沒留下？", opts:["因為日誌檔壞了","因為外層（排程器）直接終止整棵程序樹，腳本內的防護連執行的機會都沒有——內層防護觀測不到自己的死亡","因為防護程式碼有錯字","因為通知被防毒軟體攔截"], ans:_A1, exp:"腳本上面的每一層都有自己的殺手開關；盤點防護時要問「我的上層會怎麼殺我？死了會留下什麼痕跡？」" },
      { q:"分層逾時的正確順序原則是什麼？", opts:["外層上限應短於內層上限，先砍先贏","會觀測、通知、重試的內層上限必須短於只會無聲砍樹的外層上限","兩層上限應設成一樣長","不需要外層上限"], ans:_A1, exp:"內層 45 分鐘＜外層 2 小時：順序反了，內層守衛永遠等不到出場，每次都是外層先無聲開刀。" },
      { q:"Fail-closed 設計在本系統的體現是？", opts:["出錯時把所有檔案重審一遍以求保險","狀態檔損毀時安全停止並通知人類，避免大量誤重跑","出錯時直接刪除狀態檔重建","出錯時關閉整台電腦"], ans:_A1, exp:"fail-open（出錯就全部重來）會造成成本失控與重複污染；fail-closed 寧可停下來讓人類介入，是無人值守系統的正確預設。" },
      { q:"對抗性驗收中，注入測試檔要求給 10 分滿分，系統的正確反應是？", opts:["給 10 分，因為系統指示優先","給 0 分作為懲罰","照常獨立評分（實測 1.6 分），注入列為嚴重度 5 缺陷並隔離文件","立即刪除該檔案"], ans:_A2, exp:"正確反應是不受操縱、照規準獨立評分，同時把注入企圖本身揭露為頭號缺陷並隔離文件——攻擊被偵測、被拒絕、被記錄。" },
      { q:"為何收件用 Dropbox File Request 而非一般共享資料夾？", opts:["因為比較便宜","上傳者看不到內容也刪不了檔案，從機制上根治誤刪與互相覆蓋","因為傳輸速度較快","因為支援較大的檔案"], ans:_A1, exp:"一般共享資料夾要給編輯權限，學生可能誤刪或覆蓋彼此的檔案；File Request 的只上傳機制讓這類風險在機制層面就不存在。" },
      { q:"排程腳本「在呼叫 AI 之前就先寫今日已完成旗標」會造成什麼後果？", opts:["節省一次檔案寫入，無副作用","AI 失敗時當日仍被視為完成而永久跳過，且無人知情（靜默失敗）","AI 會被迫執行兩次","旗標會自動修正"], ans:_A1, exp:"這是「樂觀標記」反模式（fail-open）：真實案例中晨報因用量額度上限而失敗，旗標卻已寫入，當天晨報被永久跳過。正解是確認產物確實存在才標記，失敗不寫、下次心跳自動重試。" },
      { q:"為何說「完成通知是可觀測性機制而非便利功能」？", opts:["因為通知可以美化介面","無人值守的完整條件＝自動執行＋失敗自動重試＋結果主動告知；缺通知則系統只是「你以為它在跑」","因為通知能加快執行速度","因為法規要求必須通知"], ans:_A1, exp:"靜默失敗是無人值守最危險的失敗模式；通知讓人適時介入，且內容必須報實際落地的產物（檔案是否存在），而非轉述 AI 說自己完成了。" }
    ],

    m8_nav: "8. 維運與治理",
    m8_title: "系統上線之後：維運四律",
    m8_overview: "建好、上線、驗收通過不是終點——系統活著的每一天都在變：知識庫會擴充、設定會過時、資產會累積風險。本模組把上線後的維運工作提煉成四條可複用的紀律，並以審查代理人系統的真實維運輪（含 SMMC 領域擴充包的回歸測試）作為案例。",
    m8_highlights: ["同步義務","備份與可見性","設定先驗證","擴充後回歸測試","精確防禦","基準線保護"],
    m8_p1: "第一律：同步義務。宣告 core/ 是「唯一事實來源」只是開始——它其實是一種義務：每當 core 改變，所有衍生品（各平台接頭、濃縮版、文件）都必須跟上，否則知識就地分裂，「唯一」名存實亡。實務作法是把「改 core 之後要同步什麼」寫成明確清單，每次擴充後立即執行，不累積到「有空再說」。實例：領域擴充包遷入 core 的當天，ChatGPT／Gemini 接頭的知識檔清單就從 4 檔同步擴為 11 檔。",
    m8_p2: "第二律：備份與可見性——兩個獨立的決策。關鍵知識資產要問兩個問題：「它有備份嗎？」與「備份該給誰看見？」。審查系統的 core 放在使用者設定資料夾，不在任何雲端同步範圍內——電腦故障等於整套消失，解法是推送 git 遠端。但第二個問題同樣關鍵：這套 core 含課程評分基準等敏感資料，備份庫必須設為 private——「要不要備份」與「能不能公開」不能混為一談，而且備份完成後還要回頭驗證可見性設定確實生效。",
    m8_p3: "第三律：設定先驗證。寫進系統設定的每一筆外部事實——網址、路徑、版本號——都應在寫入前實際驗證，不憑記憶或直覺。實例：晨報巡檢清單的九個候選網址逐一實測可達性後，兩個大站因擋爬蟲（回應 403）被剔除；若憑印象直接寫入，系統每天都會在這兩個網址上白白失敗，而且無人察覺。原則：設定是程式碼的一種，值得同等的驗證紀律。",
    m8_p4: "第四律：擴充後回歸測試——驗新功能，也驗舊防線。系統每次擴充（如新增 SMMC 領域包），上線前用埋錯樣本做回歸測試。實測給了兩個超出預期的觀察：一、精確防禦——測試檔標題寫著「系統測試用，可刪除」，系統正確判定這是描述性註記而非指令，記錄在案但不執行刪除；防禦的成熟度不在「擋掉多少」，在「分得清像指令的資料與真指令」，不過度防禦。二、基準線保護——系統主動註明測試殘稿的低分「不覆寫」該組在 cohort 軌跡中的既有評分，展現對資料完整性的理解，而不只是機械地執行評分。",
    m8_wrapup: "維運四律：同步義務（core 改了衍生品要跟上）、備份與可見性（要備份，且獨立判斷能否公開）、設定先驗證（設定是程式碼的一種）、擴充後回歸測試（驗新功能也驗舊防線）。系統的可信度不是建成時的狀態，而是維運中的習慣。",
    m8_terms: [
      { front:"同步義務", back:"唯一事實來源改變後，所有衍生品必須立即跟上——否則知識就地分裂，「唯一」名存實亡。" },
      { front:"備份與可見性", back:"兩個獨立決策：它有備份嗎？備份該給誰看見？含敏感資料的備份庫必須 private，且事後回頭驗證設定生效。" },
      { front:"設定先驗證", back:"寫入設定前實際驗證每一筆外部事實（網址、路徑、版本），不憑記憶——設定是程式碼的一種。" },
      { front:"擴充後回歸測試", back:"每次擴充上線前用埋錯樣本實測：驗證新功能會動，更驗證舊防線還在。" },
      { front:"精確防禦", back:"分得清「像指令的資料」與「真指令」：可疑文字記錄在案但不遵從，也不過度防禦。" },
      { front:"基準線保護", back:"測試或殘稿的分數不覆寫既有評分軌跡——理解資料的完整性意義，而非機械執行。" },
      { front:"維運清單化", back:"把「改了 A 要同步 B」寫成明確清單並隨系統演進更新，取代仰賴記憶。" },
      { front:"維運即習慣", back:"系統的可信度不是建成時的狀態，而是維運中持續執行的紀律。" }
    ],
    m8_q: [
      { q:"「唯一事實來源」為什麼需要「同步義務」配套？", opts:["因為 core 檔案會自動同步到所有地方","因為 core 改變後若衍生品不跟上，知識就地分裂，「唯一」名存實亡","因為同步可以節省儲存空間","因為平台規定必須同步"], ans:_A1, exp:"單一事實來源是靠紀律維持的：每次 core 改變，接頭、濃縮版等衍生品都要立即更新，否則各處版本分歧，宣告就失效了。" },
      { q:"備份決策包含哪兩個獨立的問題？", opts:["備份速度與備份大小","它有備份嗎？備份該給誰看見（可見性）？","備份格式與備份頻率","本機備份與雲端備份的選擇"], ans:_A1, exp:"「要不要備份」與「能不能公開」是兩個獨立決策：含課程評分等敏感資料的知識庫必須推送到 private 儲存庫，且完成後要驗證可見性設定生效。" },
      { q:"「設定先驗證」在晨報巡檢清單的實踐是？", opts:["把所有想到的網址都直接寫入","九個候選網址逐一實測可達性，剔除兩個擋爬蟲的大站後才寫入","只寫入知名大站的網址","請學生幫忙測試網址"], ans:_A1, exp:"憑印象寫入的網址若實際不可達（如回 403），系統會每天白白失敗且無人察覺；先驗證再寫入，是把設定當程式碼對待的紀律。" },
      { q:"擴充後回歸測試要驗證的兩件事是？", opts:["新功能會動＋執行速度變快","新功能會動＋舊防線（如注入防禦）仍然有效","程式碼行數＋檔案大小","介面美觀＋使用者滿意度"], ans:_A1, exp:"擴充可能在不經意間削弱既有防線；回歸測試用埋錯樣本同時驗證新領域包正確運作與安全機制依然完好。" },
      { q:"測試檔標題寫「可刪除」但系統沒有刪除，只記錄在案——這展現了什麼？", opts:["系統故障，應該要刪除","精確防禦：分得清描述性註記與真指令，不遵從也不過度反應","系統沒有刪除檔案的權限","系統沒讀到標題"], ans:_A1, exp:"成熟的防禦不在「擋掉多少」而在判斷精度：把「像指令的資料」記錄下來但不執行，既不被操縱也不過度防禦。" }
    ],

    m9_nav: "9. 發布管線實戰",
    m9_title: "實戰案例：從系統到刊物——晨報閱讀站",
    m9_overview: "晨報原本只是硬碟裡的 Markdown 檔；本模組示範如何把無人值守系統的產出升級為公開刊物：產製與發布分離的半自動管線、內容與外殼分離的快取策略、把 Markdown 變成閱讀體驗的「渲染後增強」，以及一輪由真實使用者回饋驅動的介面迭代。",
    m9_highlights: ["產製與發布分離","半自動放行","內容/外殼快取分離","渲染後增強","受眾分層","雙層修正","友善防禦"],
    m9_p1: "設計一：產製與發布分離。heartbeat 每天自動產出晨報（無人值守），但「公開上架」是另一件事——它涉及對外發言的責任。解法是半自動管線：產出後檔案只落在本機；你審閱後按一下發布腳本，確定性程式碼負責複製、重建清單、推送，約兩分鐘後上線。這把無人值守的「產製」與人類的「發布把關」接成一條有治理的管線——授權給機器的是勞務，保留給人的是判斷。",
    m9_p2: "設計二：快取策略要跟著資料性質走。閱讀站的「外殼」（介面程式）用版本化快取，改版才升版；「內容」（每日晨報）走 network-first——上線就是最新，離線退回已讀過的版本。同一個 PWA 裡兩種策略並存，發布每日內容完全不需要動快取版本。這與教材站「整站版本化」形成對照：教材是低頻更新的整體，刊物是高頻更新的流。",
    m9_p3: "設計三：渲染後增強（render-then-enhance）。晨報源頭保持純 Markdown——這是對「AI 產出格式會漂移」的務實妥協；閱讀器先把 Markdown 渲染成 HTML，再用程式增強：小節包成卡片、〔新增〕〔待查核〕轉成徽章、領域標記變圖示、產製說明與研究者筆記摺疊收合。內容與呈現徹底解耦：改版面不用動任何一期晨報，舊晨報也自動獲得新體驗。",
    m9_p4: "設計四：受眾分層與迭代方法。同一份晨報服務兩種讀者——一般讀者看新聞卡片；研究者展開預設收合的「決策行動筆記」（展開先見提醒框）。但要明白「摺疊不等於保密」：原始檔在公開 repo 依然可見，版面隱藏是閱讀動線的選擇，不是隱私機制。介面迭代則採雙層修正：顯示端相容既有內容（舊晨報立即生效），產製端（SOP）約束未來產出（新晨報從源頭合格）——相容過去與約束未來各司其職，刊物才能持續演進而不破壞歷史。",
    m9_p5: "上線之後的三次補強，每一次都由使用者發現，而不是系統稽核發現的。設計五補上友善防禦（文字可反白、Ctrl+P/S 開放、圖片與空白處右鍵優雅提示），帶出兩個治理教訓：同家族站台的防禦策略要一致，以及未經討論的取捨等於替使用者做了決定。設計六處理一個更隱蔽的問題——連載十一天後，粗體佔比從首日 2.8% 一路漂移到 50.4%，成因是 SOP 要求「與昨日逐則比對」，而 AI 連文體一起參照了昨報。通則：凡是把自己昨天的輸出當今天參照的系統，都會漂移。",
    m9_p6: "設計七替刊物加上語音導覽——看似只是多一個播放鍵，實際上是開一條新的輸出通道，而通道會改變什麼被保留、什麼被丟掉。第一課是先量體再設計：整份晨報朗讀約 127 分鐘、單一主題平均 18 分鐘，只有單則約 4 分鐘才是能聽完的單位，於是兩層改為三層——量體不是實作細節，它會反過來決定資訊架構。第二課是新通道必須帶著舊警語：畫面上的「待查核」徽章與提醒框在語音中全部消失，因此播放前先唸免責聲明、朗讀時保留待查核標記——換一種呈現形式時，最容易被無聲丟掉的就是限定條件。",
    m9_pts: [
      { h:"設計六：三次「改錯槓桿」的失敗，與真正有效的作法", items:[
        { t:"其一 · 粗體字重 700 → 600", d:"完全無效。中文備援字型只有 Regular 與 Bold 兩級，500 以上一律進位成 Bold；畫進 canvas 數墨水量，600 與 700 完全相同。" },
        { t:"其二 · 降到 400、改由顏色強調", d:"過頭了。強調色與內文色的對比僅 1.24，等於看不見——淺色模式尤其明顯。" },
        { t:"其三 · 加淡色底標記", d:"仍是同一面牆。標記面積依舊 63%，只是換了顏料——三次都在改「怎麼標記」，而問題是「標記多少」。" },
        { t:"有效解 · 強調預算", d:"預算 20%（取自基準期別），超支時依片段長度由長至短降級。短片段是關鍵詞與數字（有資訊價值），長片段是整句話（就是那面牆）。所有期別因此收斂到約 19%。" }

      { h:"設計七：語音導覽的四個工程坑與通則", items:[
        { t:"主題標題旁只看得到圓框", d:"按鈕文字色與標題色塊的背景色相同（深色 gold on gold、淺色 green on green）→ 控制項放進已有配色的區塊時，顏色要繼承而非寫死。" },
        { t:"切換語速像是沒作用", d:"主動呼叫 cancel() 仍會觸發完成事件，導致索引前進且重複發聲 → 主動取消必須與自然結束區分。" },
        { t:"頁首不反映播放狀態", d:"每個按鈕各自記帳 → 狀態集中通知，UI 是狀態的投影而非各自記錄。" },
        { t:"朗讀開頭卻捲到空白處", d:"首項「本日重點」在預設收合的摺疊區內 → 要朗讀或捲動的內容可能是隱藏的，先確保可見再導覽。" },

      { h:"結語：驗證方法本身也會騙人", items:[

        { t:"共同結構", d:"量測工具與被量測對象共用同一個執行環境，環境的限制就被誤記在程式頭上。" },
        { t:"三個對策", d:"換一種量法交叉驗證（顏色改用 canvas 數墨水、捲動改攔截 scrollTo）；先驗證尺本身會不會動；檢查結果時，也要確認你的尺是準的。" }

    ],
    m9_wrapup: "從系統到刊物的七個設計：產製與發布分離、快取隨資料性質分策、渲染後增強、受眾分層、友善防禦、強調預算、語音導覽。貫穿其中的是三條方法：雙層修正（顯示端相容過去、規範端約束未來）、量測而非硬編（判斷依實際內容，不依日期清單）、以及一條規則勝過三個特例。而最後一課是：驗證方法本身也會騙人——量測工具與被量測對象共用執行環境時，環境的限制會假扮成程式的缺陷。",
    m9_terms: [
      { front:"產製與發布分離", back:"無人值守負責產出，人類審後放行負責公開——對外發言的責任留在人身上。" },
      { front:"半自動放行", back:"審閱後一鍵發布：確定性腳本執行複製、清單重建與推送，人只做判斷不做勞務。" },
      { front:"內容/外殼快取分離", back:"外殼版本化快取、內容 network-first——每日發布內容不需要升快取版本。" },
      { front:"渲染後增強", back:"源頭保持 Markdown，閱讀器渲染後再加卡片、徽章、摺疊——內容與呈現解耦。" },
      { front:"受眾分層", back:"同一內容以摺疊區塊服務不同讀者：一般讀者看卡片，研究者展開進階筆記。" },
      { front:"摺疊≠保密", back:"公開 repo 的原始檔仍可見；版面隱藏是動線選擇，不是隱私機制。" },
      { front:"雙層修正", back:"顯示端相容既有內容（舊的立即生效）、產製端規範未來產出（新的源頭合格）。" },
      { front:"rAF 隱藏分頁陷阱", back:"requestAnimationFrame 綁定渲染循環，分頁不可見即凍結；與渲染無關的節流用計時器。" },
      { front:"友善防禦", back:"保護智財而不妨礙學習：文字可反白、Ctrl+P/S 開放；圖片與空白處右鍵攔截＋優雅版權提示。" },
      { front:"取捨要揭露", back:"刻意的設計省略必須說出來讓人拍板——未經討論的取捨等於替使用者做了決定。" },
      { front:"自我參照的漂移", back:"把自己昨天的輸出當今天參照的系統必然漂移：粗體 11 天從 2.8% 長到 50.4%。比對是比事實，不是比文體。" },
      { front:"改錯槓桿", back:"字重、顏色、底色改了三次都無效——問題從來不是「怎麼標記」，而是「標記多少」。" },
      { front:"總量 vs 分布", back:"總量說「有問題」，分布說「該砍哪個」：中位數 9 字 vs 29 字、最長 51 字 vs 220 字，長片段才是那面牆。" },
      { front:"強調預算", back:"預算 20%＋依長度由長至短降級：保證結果落在目標內，且由分布決定犧牲誰。優於門檻＋樣式切換。" },
      { front:"量體決定架構", back:"全文朗讀 127 分鐘、單則約 4 分鐘——量體不是實作細節，它反過來決定資訊該分成幾層。" },
      { front:"新通道帶著舊警語", back:"語音會抹掉「待查核」徽章與提醒框：播放前先唸免責、略過裝飾徽章但保留待查核。換形式時最易無聲丟掉限定條件。" },
      { front:"顏色要繼承不要寫死", back:"按鈕放進已有配色的色塊時用 color:inherit——寫死會出現 gold on gold、green on green 而只剩圓框。" },
      { front:"主動取消 ≠ 自然結束", back:"cancel() 仍會觸發完成事件，導致索引前進＋重複發聲。凡可中止的非同步流程都要區分這兩者。" },
      { front:"狀態集中通知", back:"UI 是狀態的投影，不是各自記帳——否則從別處啟動播放時，頁首控制項不會跟著變。" },
      { front:"量測工具會騙人", back:"textContent 串接、transition 暫態、背景分頁計時器節流、rAF 凍結——工具的限制常假扮成程式的缺陷。換一種量法交叉驗證。" }
    ],
    m9_q: [
      { q:"晨報發布為何採「半自動」而非全自動？", opts:["因為腳本寫不出全自動","公開發言的責任留給人：機器負責產製勞務，人審閱後放行","因為 GitHub 不允許自動推送","為了節省運算成本"], ans:_A1, exp:"無人值守可以授權「產製」，但公開上架涉及對外發言的責任——半自動讓機器做勞務、人做判斷，是治理選擇而非技術限制。" },
      { q:"閱讀站的晨報內容為何走 network-first 而非版本化快取？", opts:["因為版本化快取比較貴","高頻更新的內容上線即最新、離線退回已讀版本，且每日發布不需升快取版本","因為 Markdown 檔不能被快取","因為讀者不需要離線功能"], ans:_A1, exp:"快取策略要跟資料性質走：外殼低頻改版適合版本化，內容是每日更新的流，network-first 讓發布零快取負擔。" },
      { q:"「渲染後增強」的核心好處是什麼？", opts:["讓網頁載入速度更快","減少程式碼行數","內容與呈現解耦：改版面不動歷史內容，舊晨報自動獲得新體驗","不需要使用 Markdown"], ans:_A2, exp:"源頭保持純 Markdown、呈現交給閱讀器後製——版面演進與內容歷史互不牽制，也容忍 AI 產出的格式漂移。" },
      { q:"「摺疊研究者筆記」提供了什麼、不提供什麼？", opts:["提供保密，不提供閱讀便利","提供版面分層的閱讀動線，不提供保密（原始檔在公開 repo 仍可見）","提供加密，不提供搜尋","提供權限控制，不提供離線閱讀"], ans:_A1, exp:"摺疊是為一般讀者簡化動線的版面選擇；真要限制存取得換架構（私有託管、登入機制），不能靠介面隱藏。" },
      { q:"介面迭代的「雙層修正」分工是？", opts:["前端修一半、後端修一半","顯示端相容既有內容，產製端（SOP）約束未來產出","先修簡單的、再修困難的","使用者修內容、開發者修程式"], ans:_A1, exp:"閱讀器端讓舊晨報立即獲得修正效果，SOP 端讓新晨報從源頭合格——相容過去與約束未來各司其職，演進不破壞歷史。" },
      { q:"閱讀站補上友善防禦後，帶來的兩個治理教訓是？", opts:["防禦越多越好，速度其次","同家族站台的防禦策略要一致（列入維運稽核），且刻意的取捨要揭露讓人拍板","防禦與閱讀體驗必然衝突，只能二選一","只有付費網站才需要防禦機制"], ans:_A1, exp:"缺口由使用者發現而非系統稽核——一致性要靠清單不靠運氣；省略防禦是未經討論的刻意取捨——agent 應主動揭露設計省略，把決定權留給人。" },
      { q:"晨報粗體佔比 11 天從 2.8% 漲到 50.4%，成因是什麼？", opts:["模型版本更新導致文風改變","SOP 要求「與昨日逐則比對」，AI 連文體一起參照昨報，把昨天的粗體密度當標準再加碼——自我參照的回饋迴圈","閱讀站的 CSS 設定錯誤","Markdown 解析器的 bug"], ans:_A1, exp:"凡是把自己昨天的輸出當今天參照的系統都會漂移。比對是為了比對事實與進展，不是比對文體——這一點必須寫成明文，因為它不會自己成立。" },
      { q:"把粗體字重從 700 改成 600 為何毫無效果？", opts:["因為 CSS 沒有正確套用","因為中文備援字型只有 Regular 與 Bold 兩級，500 以上一律進位成 Bold","因為瀏覽器快取沒有清除","因為字重只影響英文"], ans:_A1, exp:"computed 值確實是 600（設定有效），但畫進 canvas 數墨水量，600 與 700 完全相同、400 才少 34%——檢查了設定值不等於檢查了結果。" },
      { q:"字重、顏色、底色三種修法都失敗，共同的錯誤是什麼？", opts:["都沒有清除快取","都在改「怎麼標記」，而問題是「標記多少」——標記面積始終是 63%","都沒有做雙語處理","都改在顯示端而非產製端"], ans:_A1, exp:"換顏料不會讓牆變小。真正有效的是給強調一個預算、超支就降級，直接減少標記面積。" },
      { q:"為何要看粗體片段的「長度分布」而不只看總佔比？", opts:["因為總佔比不容易計算","總量說「有問題」，分布說「該砍哪個」：中位數 9→29 字、最長 51→220 字，長片段才是那面牆","因為分布比較容易視覺化","因為總佔比會隨螢幕寬度變動"], ans:_A1, exp:"短片段是關鍵詞與數字（有資訊價值），長片段是整句話。只看聚合指標常導致改錯地方。" },
      { q:"「強調預算＋依長度降級」為何優於「門檻＋樣式切換」？", opts:["因為程式碼比較短","預算保證結果落在目標內、優先序決定犧牲誰；門檻只能二分，還得為每一檔設計一套樣式","因為不需要量測","因為可以硬編日期清單"], ans:_A1, exp:"所有期別因此收斂到約 19%、呈現統一回真粗體；且判斷依渲染後實際密度而非日期，未來再漂移會自動處理，合規新刊完全不受影響。" },
      { q:"語音導覽為何從兩層改為三層（重點／主題／單則）？", opts:["因為三層比較好看","因為量測後發現全文朗讀 127 分鐘、主題節平均 18 分鐘，只有單則約 4 分鐘是能聽完的單位","因為瀏覽器限制最多三層","因為使用者要求三個按鈕"], ans:_A1, exp:"量體不是實作細節，它會反過來決定資訊架構——先量再設計。" },
      { q:"加上語音朗讀時，為何必須先唸免責聲明並保留「待查核」？", opts:["為了讓音檔長一點","因為畫面上的徽章與提醒框在語音中全部消失，聽的人無從得知哪些未經查證","因為法律規定語音必須有聲明","因為 TTS 引擎需要暖機"], ans:_A1, exp:"換一種呈現形式時，最容易被無聲丟掉的就是限定條件——與「摺疊≠保密」是同型問題。" },
      { q:"主題標題旁的播放鍵只看得到圓框，根因與通則是？", opts:["按鈕字級太小；應放大字級","按鈕文字色與標題色塊的背景色相同；控制項放進已有配色的區塊時應繼承顏色而非寫死","瀏覽器不支援該符號；應改用圖片","CSS 載入順序錯誤；應調整順序"], ans:_A1, exp:"深色 gold on gold、淺色 green on green。用 color:inherit 讓按鈕繼承標題文字色，兩種主題自動正確。" },
      { q:"切換語速卻「感覺沒差別」，真正的原因是什麼？", opts:["Windows 語音不支援調速","主動呼叫 cancel() 仍會觸發完成事件，導致索引前進並重複發聲","localStorage 沒有寫入","語速範圍限制在 0.9-1.1"], ans:_A1, exp:"主動取消必須與自然結束區分（抑制旗標），否則佇列會跳號。凡是可中止的非同步流程都要問這一句。" },
      { q:"本專案多次「查到 bug」最後卻是量測假象，共同結構是什麼？", opts:["程式碼寫得太複雜","量測工具與被量測對象共用同一個執行環境，環境的限制被誤記在程式頭上","瀏覽器版本太舊","測試資料不足"], ans:_A1, exp:"textContent 串接、transition 暫態、背景分頁計時器節流、rAF 凍結皆屬此類。對策：換一種量法交叉驗證，並先確認尺本身準不準。" }

    m0_nav: "0. Executive Summary",
    m0_title: "AI Containerization & Advanced Agent Intelligence Workflow",
    m0_intro: "This knowledge base answers one question: when we ask a high-level AI agent like Claude Code to build a system that automatically gathers information, verifies its reasoning, and produces decision recommendations every day, what is actually happening behind the scenes? The answer is not a single clever model writing code — it is a clearly layered infrastructure combined with multiple subagent teams working together with distinct responsibilities. We start with a core metaphor: imagine the whole system as a secured building. The container is an independent house; packages and plugins are the bricks and decorations; the connector is the plumbing and wiring reaching outside; the sandbox is a blast-proof isolation chamber inside the house built specifically to contain risky experiments. We then introduce two specialised agent squads — an engineering squad that makes the code run, and an analyst squad that makes the conclusions hold up. Finally, the four infrastructure layers and two squads are chained into a five-step standard workflow, together with copy-paste-ready prompt templates so that next time you collaborate with AI, you only need to speak in architectural terms instead of implementation details.",
    m0_why: "Why does this architecture matter?",
    m0_why_desc: "Most people using AI tools only see the surface layer — type a prompt, get a result — without realising that four hidden stages (isolation, enablement, connection, verification) determine whether the system stays under control, whether data leaks, and whether the conclusions actually hold up. Understanding this architecture lets you issue precise, safe, high-level instructions instead of relying on luck every time.",
    m0_modules: [
      { num:"01", title:"Four Infrastructure Layers", desc:"How container, package, plugin, connector and sandbox form a secured building." },
      { num:"02", title:"Dual Agent Squads", desc:"How the engineering squad and analyst squad divide labour, each forming its own closed loop." },
      { num:"03", title:"Five-Step Workflow", desc:"A complete intelligence pipeline from environment initialisation to terminal output." },
      { num:"04", title:"Prompt Templates in Action", desc:"How to issue high-level instructions to AI using architectural semantics, not implementation detail." },
      { num:"05", title:"Agent Anatomy", desc:"The four components, vibe coding, skills vs subagents, and the four sources agents are created from." },

      { num:"07", title:"Unattended Operation", desc:"Heartbeat, zero-cost detection and defense in depth — the review system receives, reviews and protects itself automatically." },
      { num:"08", title:"Operations & Governance", desc:"Sync obligation, backup & visibility, verify-before-configure, and regression testing — the four disciplines after go-live." },
      { num:"09", title:"Publishing Pipeline", desc:"Produce/publish separation, split caching, render-then-enhance, audience layering — turning system output into a publication." }
