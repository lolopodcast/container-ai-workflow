    m1_nav: "1. Four Infrastructure Layers",
    m1_title: "Core Design Principles & Four Infrastructure Layers",
    m1_overview: "This module establishes the foundational metaphor of the whole knowledge base: imagine the AI system as a secured building, layered from inside out into an isolation layer, a capability layer, a communication layer, and a safety layer — corresponding to container, package/plugin, connector, and sandbox.",
    m1_highlights: ["Container","Package","Plugin","Connector","Sandbox"],
    m1_p1: "The container is the foundation of the whole architecture, playing the role of 'an independent house': it packages the application together with the underlying operating system, runtime, and dependencies into a lightweight isolated space. Its meaning lies in consistency — the same container produces the same result no matter which computer or cloud platform it runs on, which is the precondition for an AI model to run reliably.",
    m1_p2: "Once the house is built, we need bricks and decoration — the capability layer played by packages and plugins. A package is a pre-written function library that cannot run on its own, such as pandas for data analysis or playwright for web scraping; a plugin attaches to a host program to extend or enhance a specific function, such as PDF unlocking or multimodal vision processing. Neither can operate independently, yet both are indispensable building materials that give the system its actual capabilities.",
    m1_p3: "Next comes the communication layer's connector, playing the role of 'external plumbing and wiring': it does not execute any logic itself, but safely links the AI to the outside world — a company's SQL database, Google Drive, or an external news API — by carrying data back and forth between systems.",
    m1_p4: "The most critical, and most commonly misunderstood, layer is the sandbox in the safety layer. Many people intuitively picture the sandbox as 'a fence around the outside of the house' meant to keep intruders out — but this metaphor points in the wrong direction. The risk the sandbox actually manages comes from the inside: code the AI itself generates and has not yet been verified. A more accurate metaphor is a dedicated blast-proof isolation chamber inside the house: AI-generated code is confined to this extremely low-privilege room to run, and even if the logic is flawed or behaves maliciously, the danger stays locked inside the chamber instead of spreading to the core system.",
    m1_wrapup: "From the inside out, the four infrastructure layers are the isolation layer (container), the capability layer (package/plugin), the communication layer (connector), and the safety layer (sandbox). The container defines the boundary, packages and plugins provide capability, the connector handles external links, and the sandbox stops internal risk from spreading — each with a clear, indispensable role, together forming the stable and safe foundation an AI system runs on.",
    m1_terms: [
      { front:"Container", back:"An independent house: packages the app with its runtime into a consistent isolated space, so results are identical wherever it runs." },
      { front:"Package", back:"The bricks of the house: pre-written function libraries that cannot run alone, such as pandas or playwright." },
      { front:"Plugin", back:"The house's decoration: attaches to a host program to extend a specific function, such as PDF unlocking or multimodal vision." },
      { front:"Connector", back:"External plumbing and wiring: carries data between systems and platforms without executing any logic itself." },
      { front:"Sandbox", back:"A blast-proof chamber inside the house: contains internal risk (AI-generated code) so failures never reach the core system." },
      { front:"Isolation Layer", back:"Formed by the container; defines the boundary within which the entire system operates." },
      { front:"Capability Layer", back:"Formed by packages and plugins; gives the system its actual usable functions." },
      { front:"Safety Layer", back:"Formed by the sandbox; contains internal risk rather than defending against external intrusion." }
    ],
    m1_q: [
      { q:"Which metaphor most accurately describes the sandbox's function?", opts:["A fence around the outside of the house to keep intruders out","A blast-proof isolation chamber inside the house for risky experiments","Plumbing and wiring connecting the house to the outside","Bricks used to build the house"], ans:_A1, exp:"The sandbox is meant to contain internal risk — AI-generated, unverified code — not to defend against external intrusion, so the correct metaphor is an internal isolation chamber, not an outer fence." },
      { q:"What do packages and plugins have in common?", opts:["Both can run independently without any host program","Both must attach to some environment or host program to operate","Both are bridges that carry data across systems","Both are isolated spaces that limit risky execution"], ans:_A1, exp:"A package is a library and a plugin attaches to a host program — neither runs independently; both are capability-layer building materials." },
      { q:"What is the connector mainly responsible for in this architecture?", opts:["Executing complex business logic","Carrying data between systems or platforms","Confining code to a low-privilege environment","Providing decorative colour and layout"], ans:_A1, exp:"The connector itself executes no logic — it only carries and relays data, such as linking to a database or an external API." },
      { q:"Why is the container called the 'foundation' of the whole architecture?", opts:["Because it beautifies the user interface","Because it packages the app and runtime into a consistent isolated space that everything else depends on","Because it performs dialectical business analysis","Because it is a collection of all packages and needs nothing else"], ans:_A1, exp:"The container provides a consistent, isolated execution environment that packages, plugins, connectors and sandboxes all depend on as their base boundary." },
      { q:"What is the correct inside-out order of the four infrastructure layers?", opts:["Safety→Communication→Capability→Isolation","Isolation→Capability→Communication→Safety","Capability→Isolation→Safety→Communication","Communication→Safety→Isolation→Capability"], ans:_A1, exp:"From inside out: isolation layer (container) → capability layer (package/plugin) → communication layer (connector) → safety layer (sandbox)." }
    ],

    m2_nav: "2. Dual Agent Squads",
    m2_title: "Agent Collaboration Architecture: The Dual-Squad System",
    m2_overview: "This module explains how a high-level AI agent splits into two independent squads by purpose: an engineering squad that makes code run, and an analyst squad that makes conclusions hold up — each forming its own closed loop while sharing the same sandbox for execution and verification.",
    m2_highlights: ["Engineer Subagent","Tester Subagent","Proponent Analyst","Critic Analyst","Synthesizer","Self-Healing Loop","Dialectical Reasoning"],
    m2_p1: "When a self-iterating tool like Claude Code handles a broad task, it does not rely on a single role to do everything — behind the scenes it splits into different subagent teams working together. The first is the Engineering Squad, made up of an Engineer and a Tester: the Engineer understands the requirement and context and writes the corresponding automation script or analysis code; the Tester drops that code into the sandbox to run it, catches error messages, and feeds them back to the Engineer for correction. Together they form a self-healing loop of 'write code → error → self-correct → re-run', continuing until the program succeeds, entirely without disturbing the user.",
    m2_p2: "But the Engineering Squad alone is not enough. Step 4 of the original workflow mentioned 'dialectical analysis between opposing viewpoints on simulated data' — which actually implies an entirely different kind of team: the Analyst Squad. This squad does not write code; instead it debates what the data actually means. A Proponent Analyst argues the positive case from technical feasibility and market opportunity; a Critic Analyst raises risks, schedule delays and business impact as counter-arguments; finally a Synthesizer consolidates both sides into a single actionable conclusion with an attached confidence level.",
    m2_p3: "Notably, although the two squads serve different purposes, they share the same sandbox for execution and verification: the Engineering Squad verifies 'does the code run', while the Analyst Squad verifies 'does the conclusion hold up'. Keeping these two loops separately defined prevents the mistaken assumption that 'AI auto-generating code' and 'AI auto-making business judgments' are the same thing — the former is an engineering problem, the latter a judgment problem, each needing different roles and different acceptance criteria.",
    m2_wrapup: "High-level AI agent collaboration is never a single role doing everything — it splits by purpose into two squads: the Engineering Squad (Engineer + Tester) forms a code self-healing loop; the Analyst Squad (Proponent + Critic + Synthesizer) forms a dialectical reasoning loop. Both share the sandbox as their verification ground, but with completely different acceptance criteria — precisely the role gap the original knowledge base overlooked and this revision fills.",
    m2_terms: [
      { front:"Engineer Subagent", back:"Engineering Squad member who understands the requirement and writes automation scripts or analysis code." },
      { front:"Tester Subagent", back:"Engineering Squad member who runs code in the sandbox, catches errors, and feeds them back for correction." },
      { front:"Self-Healing Loop", back:"Write code → error → correct → re-run, repeating until the program runs successfully — the engineering verification loop." },
      { front:"Proponent Analyst", back:"Analyst Squad member who argues the positive case from technical feasibility and market opportunity." },
      { front:"Critic Analyst", back:"Analyst Squad member who raises risk, schedule and business-impact counter-arguments." },
      { front:"Synthesizer", back:"Analyst Squad member who consolidates both sides into one actionable conclusion with a confidence level." },
      { front:"Dialectical Reasoning Loop", back:"Proponent argues → Critic challenges → Synthesizer consolidates — the analytical loop verifying whether a conclusion holds up." }
    ],
    m2_q: [
      { q:"What exactly is the Engineering Squad's 'self-healing loop'?", opts:["Proponent argues → Critic challenges → Synthesizer consolidates","Write code → error → correct → re-run until it succeeds","Fetch news → compare with history → produce summary","Build container → load packages → connect to external data"], ans:_A1, exp:"The self-healing loop is the Engineer-Tester cycle of writing code, running it in the sandbox, hitting errors, and correcting — repeated until the program runs successfully." },
      { q:"Why did the original knowledge base need an added 'Analyst Squad'?", opts:["Because the Engineer and Tester aren't efficient enough and need more staff","Because the original workflow described pro/con dialectical analysis without defining any corresponding role","Because the sandbox needs more people to maintain it","Because the connector needs shifts of people to ensure data fetching"], ans:_A1, exp:"Step 4 of the original workflow mentioned 'pro/con dialectical analysis' but only the Engineer and Tester had been defined — the Analyst Squad was added to fill that gap." },
      { q:"What is the difference between the Proponent Analyst and the Critic Analyst?", opts:["The Proponent writes code and the Critic tests it","The Proponent argues technical feasibility and market opportunity, the Critic raises risk and business-impact concerns","The Proponent fetches data and the Critic stores it","There is no real difference, only the names differ"], ans:_A1, exp:"The Proponent focuses on the positive case, the Critic focuses on risk and challenge — their opposing views are what makes the dialectic effective." },
      { q:"What do the Engineering Squad and Analyst Squad have in common?", opts:["Both squads write business reports","Both squads share the same sandbox for execution and verification, but with different acceptance criteria","Neither squad needs a sandbox","Their work is identical, just duplicated"], ans:_A1, exp:"Both squads use the sandbox as their verification ground: the Engineering Squad verifies whether code runs, the Analyst Squad verifies whether the conclusion holds up — different acceptance criteria." },
      { q:"What is the Synthesizer's main responsibility?", opts:["Writing automation scripts","Running code in the sandbox and catching errors","Consolidating pro/con arguments into one actionable conclusion with a confidence level","Periodically fetching news and comparing it against the history base"], ans:_A2, exp:"The Synthesizer neither writes code nor debates — it consolidates both sides' views into the final actionable conclusion." }
    ],

    m3_nav: "3. Five-Step Workflow",
    m3_title: "Standard Workflow SOP: Five Steps",
    m3_overview: "This module chains the four infrastructure layers and two agent squads into a complete intelligence pipeline: environment initialisation, tool loading, secure data linking, sandbox verification and dialectic, and finally BI chart and decision output.",
    m3_highlights: ["Environment Init","Tool & Skill Loading","Secure Data Linking","Sandbox Verification & Dialectic","Terminal Output"],
    m3_p1: "Step one is environment initialisation, corresponding to the container: Claude Code launches an independent logical container using the current project directory as its boundary, keeping project data safely isolated from the local system. This step involves no agent squad at all — it is purely infrastructure setup.",
    m3_p2: "Step two is tool and skill loading, corresponding to packages and plugins: the AI autonomously reviews the task requirement and installs packages for data analysis or web scraping, then loads plugins for specific formats (such as PDF unlocking or multimodal vision), giving later steps full operating capability. Step three is secure data linking, corresponding to the connector: through an API or filesystem connector, it periodically fetches the latest news on the configured topic and compares it against the accumulated history in the knowledge_base folder, producing the raw material for a daily briefing.",
    m3_p3: "Step four is the core of the whole workflow, corresponding to the sandbox, and the stage where both agent squads truly appear: the Engineering Squad (Engineer + Tester) writes and debugs the scientific model used for evaluation; the Analyst Squad (Proponent + Critic + Synthesizer) then performs dialectical analysis on the old versus new data using the sandbox's simulation results. Even if the code logic is flawed, or the reasoning briefly drifts off course, the danger and error stay locked inside the sandbox and never reach the core system.",
    m3_p4: "Step five is terminal output, and it deliberately corresponds to no infrastructure concept at all, because it is the ultimate purpose the first four layers jointly serve: once sandbox verification succeeds, the AI exports the data, automatically renders it as a web-based BI trend chart, and combines it with the Analyst Squad's dialectical conclusion to output a 'recommended decision action' and 'issues to keep tracking' at the terminal. Without this step's output, all the preceding isolation, enablement, connection and verification would be meaningless.",
    m3_wrapup: "The five-step workflow runs: environment initialisation (container) → tool and skill loading (package/plugin) → secure data linking (connector) → sandbox verification and dialectic (both squads) → terminal output (BI chart and decision recommendation). The first four steps build infrastructure layer by layer; step five is the only step in the entire pipeline that corresponds to no infrastructure concept, yet is the one that actually creates value.",
    m3_terms: [
      { front:"Step 1 Environment Init", back:"Launches an independent container bounded by the project directory, isolating the local system — corresponds to the container." },
      { front:"Step 2 Tool & Skill Loading", back:"Autonomously installs packages such as data-analysis and scraping libraries, loads format-specific plugins — corresponds to package/plugin." },
      { front:"Step 3 Secure Data Linking", back:"Uses a connector to periodically fetch news and diff it against the history base, producing briefing material." },
      { front:"Step 4 Sandbox Verification & Dialectic", back:"Engineering Squad runs the model, Analyst Squad debates — both inside the sandbox so errors never spill out." },
      { front:"Step 5 Terminal Output", back:"Renders BI charts and outputs decision recommendations — the ultimate goal the first four steps serve, matching no infrastructure concept." }
    ],
    m3_q: [
      { q:"In the five-step workflow, which step corresponds to no infrastructure concept?", opts:["Step 1 Environment Init","Step 3 Secure Data Linking","Step 5 Terminal Output","Step 2 Tool & Skill Loading"], ans:_A2, exp:"Step 5 is the ultimate output the first four infrastructure layers jointly serve — it does not itself correspond to container, package, connector or sandbox." },
      { q:"Who executes Step 4 (sandbox verification and dialectic)?", opts:["Only the Engineer, alone","Only the connector handles it","The Engineering Squad and Analyst Squad execute together in the sandbox","Only the Synthesizer, alone"], ans:_A2, exp:"Step 4 is where both agent squads truly appear: the Engineering Squad runs the model while the Analyst Squad performs dialectical reasoning, both inside the sandbox." },
      { q:"Which concept does Step 3 'Secure Data Linking' mainly use?", opts:["Container","Package","Connector","Sandbox"], ans:_A2, exp:"Step 3 fetches news via an API or filesystem connector and compares it against the history base, corresponding to the communication layer's connector." },
      { q:"What is the correct order of the five-step workflow?", opts:["Connector→Container→Package→Sandbox→Output","Container→Package/Plugin→Connector→Sandbox→Output","Sandbox→Container→Connector→Package→Output","Output→Container→Package→Connector→Sandbox"], ans:_A1, exp:"The correct order is environment init (container) → tool loading (package/plugin) → data linking (connector) → sandbox verification and dialectic → terminal output." },
      { q:"Why is step five described as 'the only value-creating output of the whole pipeline'?", opts:["Because it consumes the most computing resources","Because the first four steps are only infrastructure setup — without step five's output the whole pipeline has no practical meaning","Because it is the only step requiring human intervention","Because it needs no results from any prior step"], ans:_A1, exp:"The first four steps (container, package/plugin, connector, sandbox) are infrastructure and verification; only step five's BI chart and decision recommendation is the value the user actually needs." }
    ],

    m4_nav: "4. Prompt Templates in Action",
    m4_title: "Applied Practice: Prompt Templates & Scenario Drills",
    m4_overview: "This module explains how to instruct a high-level agent like Claude Code using 'architectural semantics' instead of 'implementation detail', and provides both a full and a quick prompt template you can apply to your own topic immediately.",
    m4_highlights: ["Architectural Semantics","Vibe Coding","Full Template","Quick Template","Topic Substitution"],
    m4_p1: "The most common mistake when using an agent like Claude Code is describing implementation details exhaustively — 'how exactly to write the scraper', 'which chart library to use' — which mistakenly hands back to the user decisions the AI should be making autonomously. The genuinely efficient approach is Vibe Coding: describe only the 'architectural semantics' and the 'output goal' you want, and let the two subagents — Engineer and Tester — handle package selection, code writing and debugging on their own.",
    m4_p2: "The full prompt template explicitly marks which layer or which agent squad each sentence maps to: the first sentence corresponds to the connector, requesting news be fetched and compared against the history base; the second corresponds to the Analyst Squad, requesting pro/con dialectic and a consolidated conclusion; the third corresponds to the sandbox and the Engineering Squad, requesting all verification scripts run safely in the sandbox with self-correction; the fourth corresponds to terminal output, requesting a BI chart and decision recommendation. Splitting the prompt into four sentences, each mapped to one concept or role, greatly reduces the chance the AI misunderstands the requirement.",
    m4_p3: "The quick template condenses the same four sentences into one, suitable once you are already familiar with this architectural semantics and want to trigger the same workflow quickly. Whether full or quick, the core technique is identical: simply replace the bracketed [topic] placeholder — there is no need to redesign the whole pipeline each time, because the container, packages, connector, sandbox, dual squads and five-step workflow are already a fixed architecture meant to be reused.",
    m4_wrapup: "The key to instructing a high-level AI agent is not describing implementation detail, but expressing your desired output goal in the 'architectural semantics' of the four infrastructure layers and the dual agent squads. The full template maps each sentence to a concept or role; the quick template is the same logic condensed for fast triggering. Both share one principle: only the topic changes — the architecture itself is reusable.",
    m4_terms: [
      { front:"Architectural Semantics", back:"Describing a requirement using concepts like container, connector, sandbox and agent squads, instead of implementation detail." },
      { front:"Vibe Coding", back:"A collaboration style where you describe only the goal and architectural semantics, leaving package choice, code writing and debugging to the AI." },
      { front:"Full Template", back:"Four sentences, each mapped in turn to the connector, the Analyst Squad, the sandbox/Engineering Squad, and terminal output." },
      { front:"Quick Template", back:"The same four sentences condensed into one, for quickly triggering the workflow once you know the architecture." },
      { front:"Topic Substitution", back:"The only part of the template that changes — the architecture itself is reusable across topics." }
    ],
    m4_q: [
      { q:"What is the most common mistake when using Claude Code?", opts:["Describing too much architectural semantics, confusing the AI","Describing implementation detail exhaustively, handing back to the user decisions the AI should make","Never issuing any instruction at all","Only ever using the quick template, never the full one"], ans:_A1, exp:"The common mistake is over-specifying implementation details (like which scraping library to use), which hands back to the user decisions the AI should autonomously make — against the spirit of Vibe Coding." },
      { q:"Which concept and role does the third sentence of the full template mainly correspond to?", opts:["Connector and data fetching","Sandbox and the Engineering Squad","Container and environment initialisation","Plugin and format handling"], ans:_A1, exp:"The third sentence requests all verification and computation scripts run safely in the sandbox, self-corrected by the Engineer and Tester if they fail — corresponding to the sandbox and Engineering Squad." },
      { q:"What is the relationship between the quick template and the full template?", opts:["The two use entirely different architectural principles","The quick template is the same logic condensed into one sentence from four","The quick template contains more detail than the full one","The quick template only suits programmers, the full one suits general users"], ans:_A1, exp:"The quick and full templates share the same architectural semantics — the quick one simply condenses four sentences into one, for use once you're already familiar with the architecture." },
      { q:"When applying the template to a new topic, what actually needs to change?", opts:["The entire architectural semantics must be redesigned","Only the topic inside the brackets needs replacing — the architecture itself is reusable","All agent roles must be redefined","The sandbox's safety mechanism must be rewritten"], ans:_A1, exp:"The architecture (container, connector, sandbox, dual squads, five steps) is fixed and reusable — only the topic itself needs to change." }
    ],

    m5_nav: "5. Agent Anatomy",
    m5_title: "Agent Anatomy: The Four Components, Skills & Subagents",
    m5_overview: "The first four modules viewed the workflow from a user's perspective; this module switches to the builder's perspective: what four components make up an agent? How do skills differ from subagents? And where can agents actually be created? Understanding this upgrades you from someone who uses AI to someone who builds AI teams.",
    m5_highlights: ["Four Components","Vibe Coding","Skill = SOP Manual","Subagent = Job Description","Relative Roles","Claude Agent SDK"],
    m5_p1: "Take any agent apart and you find the same four things: a brain (the underlying model), a set of callable tools (file I/O, terminal, browser, search), a job description that defines its role and behaviour (the system prompt), and a loop that lets it act, observe the result, and act again (the harness). When all four come together, the role can work and self-correct on its own — this is the dividing line between an agent and a plain chat model.",
    m5_p2: "Vibe coding and agents are concepts on different levels: the agent is 'who does the work', vibe coding is 'how you talk to it' — describing only the goal and architectural semantics while leaving implementation details for the agent to decide. You can own an agent without vibe coding (dictating every line yourself), and you can vibe code without a true agent (just chatting with a plain model). Combined, they form the complete collaboration pattern.",
    m5_p3: "Skills and subagents both solidify one-off vibe coding into reusable, triggerable assets — but they differ in kind. A skill is an SOP manual: verb-like, teaching the agent how a certain type of task should be done. A subagent is a job description: noun-like, defining who a role is, which tools it may touch, and which brain it runs on. A manual still needs someone to execute it; a job description directly hires a new employee. The two often work together: a manual can assign a particular step to a particular employee.",
    m5_p4: "Agents can be created from four places: (1) built-in default employees, such as the read-only searcher Explore or the planner Plan; (2) custom job cards — drop a Markdown file into the .claude/agents/ folder (YAML at the top defining name, description, tool permissions and model, with the system prompt below), and the hire is complete the moment the card goes up; (3) temporary outsourcing — verbally assign a one-off job on the spot, and the worker dissolves when it's done; (4) a programmatic HR system — defining agents in code at scale via the Claude Agent SDK. Finally, remember: agent versus subagent is not a difference of species but of relative position — the one facing the user is the main agent (the front desk); the one that takes assignments, reports back, and forgets when done is the subagent (the employee). Change the position, and the identity changes.",
    m5_wrapup: "An agent is the four-part combination of model + tools + prompt + loop; vibe coding is the high-level language for collaborating with it. A skill solidifies 'how to do it' into an SOP manual, a subagent solidifies 'who does it' into a job description — both are reusable, triggerable assets. Agents are created from four sources: built-in employees, custom job cards, temporary outsourcing, and SDK-programmatic definition; and the agent/subagent distinction lies not in essence but in who is directing whom.",
    m5_terms: [
      { front:"The Four Components", back:"Model (brain) + tools (hands) + system prompt (job description) + execution loop (work rhythm) — all four together make an agent." },
      { front:"Vibe Coding", back:"Describing only the goal and architectural semantics, leaving implementation to the agent — it is 'how you talk', not 'who does the work'." },
      { front:"Skill (SOP Manual)", back:"A verb-like asset: teaches the agent how a class of task is done; loaded into context when triggered, it cannot act by itself." },
      { front:"Subagent (Job Description)", back:"A noun-like asset: defines a resident role's duties, tool permissions and model — equivalent to hiring a new employee." },
      { front:".claude/agents/", back:"Where custom subagents are installed: one Markdown file with YAML plus a system prompt completes the hire." },
      { front:"Temporary Agent", back:"A one-off outsourced worker assigned on the spot, dissolving when the job is done — no job card needed." },
      { front:"Claude Agent SDK", back:"The 'HR system' for defining agents programmatically, at scale, inside your own application." },
      { front:"Main Agent vs Subagent", back:"A relative relationship, not different species: the one facing the user is the main agent; the one assigned and reporting back is the subagent." }
    ],
    m5_q: [
      { q:"What are the four components that make up an agent?", opts:["Model, tools, system prompt, execution loop","Container, package, connector, sandbox","Theorist, practitioner, critic, synthesizer","Skill, subagent, SDK, terminal"], ans:_A0, exp:"Agent = brain (model) + hands (tools) + job description (system prompt) + work rhythm (execution loop); only with all four can it act and self-correct autonomously." },
      { q:"What is the most fitting metaphor for the difference between a skill and a subagent?", opts:["Both are chatbots, there is no difference","A skill is an SOP manual (how to do it), a subagent is a job description (who does it)","A skill is hardware, a subagent is software","A skill is a paid feature, a subagent is free"], ans:_A1, exp:"A skill defines a task process verb-like and needs an agent to execute it; a subagent defines a resident role noun-like and is itself a dispatchable agent." },
      { q:"Dropping a Markdown file with YAML and a system prompt into .claude/agents/ is equivalent to what?", opts:["Firing an old employee","Hiring a resident subagent employee","Starting a sandbox environment","Publishing a page to GitHub Pages"], ans:_A1, exp:"That file is the job card: name, duties, tool permissions and model all defined — posting it completes the hire, and the main agent can then dispatch work to it." },
      { q:"What is the essential difference between an agent and a subagent?", opts:["The size of the model used","The number of tools owned","Relative position: who faces the user, and who is assigned work and reports back","The pricing model"], ans:_A2, exp:"Both are structurally complete agents; the difference is only in who directs whom — change the position and the identity changes. They are not two species." },
      { q:"What does 'you can own an agent without vibe coding' mean?", opts:["Such a situation cannot exist","Using an agent while still dictating every implementation detail, never delegating decisions to the AI","It means the agent is broken","It means only free models are used"], ans:_A1, exp:"Vibe coding is an interaction style, not the tool itself: even with an agent like Claude Code, dictating every line of code is not the spirit of vibe coding." }
    ],

    m6_nav: "6. Review Agent Case Study",
    m6_title: "Case Study: Designing the Review Agent System",
    m6_overview: "This module uses a real, built-and-tested system — the multi-perspective Review Agent — to demonstrate how the concepts of the previous five modules assemble into a working, extensible, cross-platform agent team: three resident reviewer employees, one fact-checking back office, one front-desk manual, and five key design decisions.",
    m6_highlights: ["Role-Rubric Decoupling","Full/Lite Dual Mode","Fact-check Loop","Portable Knowledge","Legacy Governance"],
    m6_p1: "The requirement: review four content types (quantitative papers, qualitative papers, financial-strategy reports, macro/market reports), each examined from three stances — theoretical, practical, and critical-risk. The architectural answer is four layers: a Chief Reviewer (main agent) classifies the document and dispatches work; three perspective reviewers (theorist, practitioner, critic) are resident subagents hired via job descriptions, holding read-only tools only; a fact-checker serves as shared back office, alone holding search and recomputation tools; finally the Chief Reviewer synthesizes everything into a report.",
    m6_p2: "Decision 1: decouple roles from rubrics. Do not build 12 employees for '4 content types × 3 perspectives' — hire only 3 fixed-role reviewers, and encapsulate all content differences into 4 rubric files. Adding a new review domain means writing one new document, touching no role at all. This is where the whole system's extensibility comes from.",
    m6_p3: "Decision 2: criticism must be verifiable — reviewers may only flag suspicious claims; the fact-checker actually verifies them with search and recomputation, ruling CONFIRMED / REFUTED / UNVERIFIABLE with sources attached. This extends the sandbox-verification spirit: a claim only counts once a tool has verified it. Decision 3: Full/Lite dual mode — Full runs multiple subagents in parallel (about 5-8× the cost, for final drafts), Lite plays the three roles sequentially in one context (daily quick checks); one knowledge base, two gears.",
    m6_p4: "Decision 4: portable knowledge, per-platform wiring — role definitions, rubrics, SOP and report templates are all plain Markdown (core/, the single source of truth); each platform keeps only a thin adapter (adapters/): Claude Code can run Full mode, while ChatGPT and Gemini can only run Lite for lack of a multi-subagent mechanism. Decision 5: legacy governance — the new system coexists with the existing specialised review skills through explicit triage rules rather than replacing them outright; only after the new system accumulates a real track record will the old skills be refactored into domain packs on the new architecture. Before launch, the whole pipeline was smoke-tested on a sample report with deliberately planted flaws: the three reviewers caught their respective defects with zero overlap, and the fact-checker refuted three key claims against public sources — that is how an architecture gets accepted.",
    m6_wrapup: "The Review Agent system demonstrates the full path from concepts to a real system: a four-layer architecture assigns the roles, role-rubric decoupling guarantees extensibility, the fact-check loop guards the factual bottom line, Full/Lite dual mode balances cost against quality, the core/adapters split delivers cross-platform portability, and legacy governance ensures a smooth transition between old and new. The value of these principles: extending to a new domain becomes 'writing one document' instead of 'rebuilding a system'.",
    m6_terms: [
      { front:"Role-Rubric Decoupling", back:"Three roles stay fixed; content differences are encapsulated in rubric files. New domain = one new document, no role touched." },
      { front:"Full Mode", back:"Parallel multi-subagent review + fact-check + synthesis; about 5-8× Lite's cost, for final drafts and high-stakes documents." },
      { front:"Lite Mode", back:"Playing the three roles sequentially in one context for quick daily reviews; ChatGPT/Gemini can only run this mode." },
      { front:"Fact-checker", back:"Shared back office: verifies flagged claims via search and recomputation; every ruling cites sources, and honest UNVERIFIABLE when nothing is found." },
      { front:"core / adapters", back:"core is the plain-Markdown single source of truth; adapters are each platform's thin wiring layer." },
      { front:"Smoke Test", back:"Running a deliberately flawed sample through the whole pipeline to verify the architecture works as designed." },
      { front:"Legacy Governance", back:"Old and new systems coexist with triage rules; old skills become domain packs only after the new system proves itself." }
    ],
    m6_q: [
      { q:"Why does the review system build only 3 roles instead of 12 subagents (4 content types × 3 perspectives)?", opts:["Because of budget constraints","Because roles and rubrics are decoupled: roles stay fixed, content differences are encapsulated in rubric files","Because the platform allows at most 3","Because reviews don't need multiple perspectives"], ans:_A1, exp:"The three reviewers' mindsets never change; content-type differences are parameterised into rubric files. Adding a domain means writing one new document — the source of extensibility." },
      { q:"In the fact-check loop, how is work divided between reviewers and the fact-checker?", opts:["Each reviewer verifies claims online by themselves","The fact-checker writes the review comments","Reviewers only flag suspicious claims; the fact-checker verifies them with search and recomputation, citing sources","Both do exactly the same work as mutual backup"], ans:_A2, exp:"Reviewers focus on reading and flagging; the fact-checker alone holds search and recomputation tools, ruling CONFIRMED/REFUTED/UNVERIFIABLE after actual verification." },
      { q:"Why can ChatGPT and Gemini web versions only run Lite mode?", opts:["Because they lack a parallel multi-subagent mechanism","Because they don't support Markdown","Because rubric files are too large to upload","Because licensing costs are too high"], ans:_A0, exp:"Full mode needs genuinely parallel, mutually independent subagents; web chat tools can only role-play sequentially in a single context — which is Lite mode." },
      { q:"What is the division of labour between core/ and adapters/?", opts:["core holds code, adapters hold documents","Portable knowledge (core, plain-Markdown single source of truth) and per-platform wiring (adapters, thin connectors)","core is for teachers, adapters for students","They hold identical content as mutual backups"], ans:_A1, exp:"Roles, rubrics and SOP are plain text in core/, usable on any platform; each platform needs only a thin layer of wiring configuration." },
      { q:"What governance strategy does the system adopt toward the existing specialised review skills?", opts:["Delete them all immediately to avoid confusion","Coexist with triage rules; refactor them into domain packs only after the new system proves itself in real use","Rename and hide them","Turn them into paid features"], ans:_A1, exp:"The old skills hold domain knowledge the new system lacks and are battle-tested; the right move is coexistence with triage, migrating gradually only after the new system earns its record." }
    ],

    m7_nav: "7. Unattended Operation",
    m7_title: "Case Study: Heartbeat & the Unattended Inbox",
    m7_overview: "The previous module built the review system; this module answers 'who presses the button' — using a heartbeat so the system automatically receives files after boot, reviews them, and delivers reports, while demonstrating the two things that matter most in unattended automation: security design and adversarial acceptance testing.",
    m7_highlights: ["Heartbeat","Zero-cost Detection","Deterministic Code vs AI","Archive-on-Intake","Defense in Depth","Fail-closed","Silent Failure & Observability"],
    m7_p1: "Heartbeat trigger design first answers 'must the computer stay on?' — no. The scheduler gets two triggers: at logon with a 5-minute delay (giving cloud sync time to pull down uploads accumulated while the machine was off) and a daily-morning backup; for ad-hoc checks there are three manual paths — a desktop shortcut, a spoken command, and a scheduler command. Intake uses Dropbox File Request: uploaders need no account, cannot see the folder's contents, and cannot delete anything — accidental-deletion risk shifts from 'rescue afterwards' to 'immune by mechanism'.",
    m7_p2: "The single most important division of labour in the whole system: 'deterministic code does the hauling, AI only does the judging'. Detecting new files, size guarding, and archive copying — work with one correct answer — goes to the scheduler script: zero cost, predictable, and impossible to trick. AI handles only the work that needs judgment: reading and reviewing. The system's heart beats every day, but money is spent only when there is real work — that is 'zero-cost detection'. Its test is not a single condition but two that must both hold before exiting free of charge: (1) no new files in the intake folders (checked against the processed ledger), and (2) today's scheduled output is already complete (checked via the day's done-marker); if either fails, the AI is woken. 'New file' has three deterministic criteria of its own: absent from the ledger or a size mismatch, last modified more than 60 seconds ago (anything newer may still be syncing), and within the size cap. The key insight: zero cost is possible only because every test was deliberately designed as a question the file system can answer — does it exist, how big, when changed — rather than one requiring the content to be understood. A cheap gatekeeper depends on the gate itself needing no intelligence.",
    m7_p3: "Unattended means nobody is watching, so safety relies on defense in depth — five mutually independent layers: (1) instruction isolation (documents are data, not instructions; a manipulation attempt = a severity-5 issue plus forced quarantine); (2) least privilege (the unattended run has no command-line access, and writes are confined to reports and state files); (3) resource guard (a 20MB size cap against space and cost exhaustion); (4) tamper detection (the knowledge base is under git version control as a baseline); (5) fail-closed — if the state file is corrupted, the system stops safely and notifies a human rather than risking a mass re-run. If one layer is breached, the next still holds.",
    m7_p4: "Pre-launch acceptance goes beyond 'the normal flow works': it includes an adversarial test — deliberately submitting a test file with an embedded prompt injection, whose final paragraph impersonates a 'system instruction' demanding the reviewer ignore all rules, award a perfect 10, and mark the file for the knowledge base. The measured result: the score was not manipulated (1.6 given), the injection was listed as the number-one severity-5 defect, the file was force-quarantined, and the system produced the correct security reasoning: 'a document that attempts to manipulate its downstream pipeline forfeits trust in its own numbers as well.' The true acceptance standard for an unattended system is how it behaves under attack while you are away.",
    m7_p5: "A real post-launch failure taught a fifth lesson: the most dangerous failure in unattended operation is not a crash but a silent skip — the system looks perfectly fine while the work simply never happened. The actual case: an after-midnight heartbeat hit the AI usage limit and produced no brief, but the scheduler had already written the 'done for today' marker before invoking the AI, so every later heartbeat that day saw the marker, concluded there was nothing to do, and the day's brief was permanently skipped. That is the 'optimistic marker' anti-pattern; the fix is confirm-then-mark — a marker records a completed fact, not an intended attempt.",
    m7_p6: "Lesson six came from the second variant of silent failure: unbounded waiting — the AI is woken and then neither succeeds nor fails; it simply never comes back. The log stops at the 'invoking AI' line, and because the flow never finishes the completion notification never fires, so a hang is invisible to the notification mechanism. The fix is a timeout cap on every call that waits on an external system, with the AI call running as a watchable child process.",
    m7_p7: "Lesson seven overturned lesson six's autopsy: those two failed runs had not hung on the AI call at all — the script itself was killed from outside. The scheduler's default 'execution time limit: 1 hour', set when the task was created, silently killed the whole process tree on the hour, leaving no log and firing no notification; the other run died when its terminal window was closed. Every defense just built inside the script never got to fire.",
    m7_pts: [
      { h:"Three ways waiting on an external system dies", items:[
        { t:"Explicit failure (an error code)", d:"The easy case: log, notify, retry. Usage limits, API faults and network drops all live here - external limits are the norm, not the exception." },
        { t:"Fake success (optimistic marker)", d:"Writing 'done' before the work, so a failure marks the day complete and skips it forever (fail-open). Counter: write the marker only after verifying the artefact exists, and on failure write nothing so the next run retries." },
        { t:"Hanging (unbounded waiting)", d:"Neither succeeding nor failing, so the notification never fires. Counter: a timeout cap, a watchable child process, output written to its own file as evidence, and a fail-closed retry path once the cap is hit." }
      ]},
      { h:"Three gates of observability", items:[
        { t:"Notification is a mechanism, not a convenience", d:"Unattended operation = automatic execution + automatic retry + proactive reporting. Without the last, the system is merely something you assume is running." },
        { t:"Report what actually landed on disk", d:"Check whether the file exists rather than restating the AI's claim of success - the same skepticism as 'criticism must be verifiable', turned on your own system." },
        { t:"Emitted is not received", d:"A popup that auto-closes after 25 seconds is never sent if nobody is watching. Detached and non-closing instead - the observability chain ends when a human receives the signal." }
      ]},
      { h:"The killer is in the outer layer: three rules", items:[
        { t:"Inner defenses cannot observe their own death", d:"Every layer above your script - scheduler, container, CI runner, operating system - has its own kill switch. Ask: how would my outer layers kill me, and what trace would be left?" },
        { t:"Ordering principle for layered timeouts", d:"The inner cap that observes, notifies and retries must be shorter than the outer limit that only kills silently (here 45 minutes inside, 2 hours outside). Reversed, the inner guard never gets its turn." },
        { t:"An unverified default is a landmine that hasn't gone off", d:"The 1-hour limit sat harmless for a week because normal runs take 15-25 minutes; the first daytime catch-up run stretched past it. Low-probability conditions detonate long-dormant configuration." }
      ]},
      { h:"Interlocking time values", items:[
        { t:"The contradiction", d:"A 30-minute stale-lock threshold against a 45-minute timeout: from minute 31 another heartbeat deems the lock stale and barges in, double-running alongside a live execution." },
        { t:"Fix and general rule", d:"Refresh the lock file while waiting. Whenever two time-conditioned mechanisms coexist, check what happens when their values stack." }
      ]}
    ],
    m7_wrapup: "A heartbeat upgrades an agent system from a tool into a service: it takes over at boot, costs nothing when idle, handles work automatically, and quarantines risk automatically. The module's six principles — deterministic-code/AI division of labour, zero-cost detection, archive-on-intake, defense in depth, fail-closed (including marker timing and timeout caps), and proactive result reporting — are not specific to review systems: they apply to any unattended AI automation. And the real acceptance test is how the system behaves under surprise and attack while you are away — plus your ability to find out what happened.",
    m7_terms: [
      { front:"Heartbeat", back:"A scheduled wake-up mechanism: the agent checks for new work on a rhythm — bound to boot, timers, or manual triggers — without waiting to be asked." },
      { front:"Zero-cost Detection", back:"A deterministic script first decides whether there is any work; if not, it simply exits — the AI is never woken and nothing is spent." },
      { front:"The Two Zero-cost Conditions", back:"(1) no new files AND (2) today's output already complete — both must hold to exit free; either failing wakes the AI." },
      { front:"'New File' Criteria", back:"Absent from the ledger or size mismatch, modified >60s ago (avoiding in-flight syncs), and within the size cap — all deterministic checks." },
      { front:"The Gate Needs No Intelligence", back:"Zero cost holds only while every test is answerable by the file system (exists/size/timestamp); needing AI to read content breaks the promise." },
      { front:"Unbounded Waiting", back:"Silent failure's second variant: a call that neither succeeds nor fails — it never returns. The completion notification never fires, so a hang is invisible to it." },
      { front:"Timeout Cap", back:"Watchable child process + kill the process tree past the cap + output to a separate file as evidence + no marker on timeout (retry path); refresh the lock while waiting to prevent double-runs." },
      { front:"Three Failure Modes", back:"Explicit failure → log, notify, retry; fake success → confirm-then-mark; hanging → timeout cap. All three covered, each with its counter." },
      { front:"The Killer Is in the Outer Layer", back:"Every layer above your script (scheduler, container, CI, OS) has a kill switch; inner defenses can't observe their own death — ask 'how would my outer layers kill me?'" },
      { front:"Layered-Timeout Ordering", back:"The inner cap that observes, notifies, and retries must be shorter than the outer limit that only kills silently; reversed, the inner guard never fires." },
      { front:"Notification's Last Mile", back:"A popup that auto-closes in 25s = never sent if nobody is watching. The observability chain ends when a human receives the signal, not when it is emitted." },
      { front:"Deterministic Code vs AI", back:"Hauling work with one correct answer (detect, copy, guard) goes to code; only judgment work (review, triage) goes to AI." },
      { front:"Archive-on-Intake", back:"Before processing, copy each file into an archive the uploader cannot touch — an immutable snapshot to fall back on whatever happens later." },
      { front:"File Request", back:"Dropbox's upload-only mechanism: no account needed, contents invisible to uploaders, nothing deletable — accidental deletion is cured by mechanism." },
      { front:"Defense in Depth", back:"Multiple independent layers (instruction isolation, least privilege, resource guard, version-control baseline, fail-closed) — breach one, the next still holds." },
      { front:"Fail-closed", back:"On abnormal state, stop safely and notify a human rather than pressing on — the opposite of fail-open (redo everything on error)." },
      { front:"Adversarial Acceptance Test", back:"Testing the system with deliberate attack samples (e.g. prompt injection); passing means the attack is detected, refused, and logged." },
      { front:"Silent Failure", back:"The most dangerous unattended failure mode: the system looks fine, the work never happened, and nobody knows." },
      { front:"Optimistic-Marker Anti-pattern", back:"Writing the 'done' marker before the action; once it fails, the day counts as done and is skipped forever (fail-open)." },
      { front:"Confirm-then-Mark", back:"Write the marker only after verifying the artefact exists; on failure write nothing and retry next time — a marker is a fact, not an intent." },
      { front:"Notification = Observability", back:"Notifications are not convenience but the mechanism that keeps humans informed; content must report what actually landed, not the AI's self-report." }
    ],
    m7_q: [
      { q:"What is the main rationale for 'deterministic code does the hauling, AI only does the judging'?", opts:["Code is faster to write","Hauling work has one correct answer: scripts do it at zero cost, predictably, and cannot be tricked — AI is saved for judgment work","AI is incapable of copying files","To reduce the number of lines of code"], ans:_A1, exp:"Detection, copying and guarding have a single correct procedure; deterministic scripts do them cheaply and are immune to prompt injection, while AI's value lies in judgment-heavy review and triage." },
      { q:"What does 'zero-cost detection' mean?", opts:["The AI provides free inspection services","The scheduler script detects whether new files exist first; if none, it exits and the AI is never woken","Detection consumes no electricity","Using a free cloud plan"], ans:_A1, exp:"The heartbeat fires daily, but detection is done by a zero-cost script; the AI is only woken when there is real work, so idle days cost nothing." },
      { q:"Which conditions must hold for a heartbeat to exit at zero cost?", opts:["No new files in the intake folders is enough","No new files **and** today's scheduled output already complete — both simultaneously","Just that a heartbeat already ran today","Just that the user did not trigger it manually"], ans:_A1, exp:"Both are required: if the brief has not been produced (no done-marker for today), the AI is woken even with no new files — which is exactly what enables automatic retry after a failure." },
      { q:"Why are all zero-cost detection tests designed as questions the file system can answer?", opts:["Because the programmer was lazy","Because the moment a test needs AI to understand content, the zero-cost promise is broken","Because file systems are more accurate than AI","Because the operating system requires it"], ans:_A1, exp:"Exists? How big? When modified? — all answerable for free. A cheap gatekeeper depends on the gate itself needing no intelligence." },
      { q:"Why is 'unbounded waiting' (a hung AI call) invisible to the completion notification?", opts:["Because notifications were disabled","Because the notification only fires when the flow finishes, and a hung run never reaches that step","Because the AI intercepts the notification","Because the log file is full"], ans:_A1, exp:"A hang neither succeeds nor fails — the flow is stuck waiting. A timeout cap forces the flow to finish, so notification and retry can take over." },
      { q:"A 45-minute timeout cap with a 30-minute stale-lock threshold — what goes wrong, and what is the fix?", opts:["Nothing; the two are unrelated","From minute 31, another heartbeat deems the lock stale and barges in, causing a double-run; fix: refresh the lock file while waiting","The timeout can never fire","The lock file gets auto-deleted"], ans:_A1, exp:"Two time-conditioned mechanisms can contradict each other when stacked — the general rule is to check what happens when their values overlap." },
      { q:"Timeout and notification defenses were built inside the script — why did the scheduler's kill still leave no trace at all?", opts:["The log file was corrupted","The outer layer (scheduler) killed the whole process tree directly, so the script's defenses never got to run — inner defenses cannot observe their own death","The defense code had a typo","Antivirus blocked the notification"], ans:_A1, exp:"Every layer above your script has its own kill switch; when auditing defenses, ask 'how would my outer layers kill me, and what trace would be left?'" },
      { q:"What is the correct ordering principle for layered timeouts?", opts:["The outer limit should be shorter — first to kill wins","The inner cap that observes, notifies, and retries must be shorter than the outer limit that only kills silently","Both limits should be equal","No outer limit is needed"], ans:_A1, exp:"Inner 45 min < outer 2 h: reverse the order and the inner guard never gets its turn — the outer layer always cuts first, silently." },
      { q:"How does fail-closed design manifest in this system?", opts:["On error, re-review every file to be safe","When the state file is corrupted, stop safely and notify a human, avoiding a mass mistaken re-run","On error, delete the state file and rebuild","On error, shut down the entire computer"], ans:_A1, exp:"Fail-open (redo everything on error) causes cost blowouts and duplicate contamination; fail-closed stops for human intervention — the correct default for unattended systems." },
      { q:"In the adversarial test, the injected file demanded a perfect 10 — what was the correct system response?", opts:["Award 10, since system instructions take priority","Award 0 as punishment","Score independently as usual (1.6 in the real test), list the injection as a severity-5 defect, and quarantine the file","Delete the file immediately"], ans:_A2, exp:"The correct response is to stay unmanipulated and score by the rubric, while exposing the injection attempt itself as the top defect and quarantining the file — attack detected, refused, and logged." },
      { q:"Why use Dropbox File Request for intake instead of an ordinary shared folder?", opts:["Because it is cheaper","Uploaders cannot see contents or delete files, curing accidental deletion and overwriting at the mechanism level","Because transfer speeds are faster","Because it supports larger files"], ans:_A1, exp:"An ordinary shared folder requires editor permissions, letting students delete or overwrite each other's files; File Request's upload-only mechanism removes that risk entirely." },
      { q:"What happens when a scheduler script writes the 'done for today' marker before invoking the AI?", opts:["It saves one file write with no side effects","If the AI fails, the day still counts as done and is permanently skipped — with nobody informed (silent failure)","The AI is forced to run twice","The marker corrects itself automatically"], ans:_A1, exp:"That is the optimistic-marker anti-pattern (fail-open): in the real case the brief failed on a usage limit yet the marker was already written, permanently skipping that day. The fix is confirm-then-mark: verify the artefact exists, and on failure write nothing so the next heartbeat retries." },
      { q:"Why is a completion notification an observability mechanism rather than a convenience feature?", opts:["Because notifications make the interface prettier","The full condition for unattended operation = automatic execution + automatic retry + proactive result reporting; without notification the system is merely something you assume is running","Because notifications speed up execution","Because regulations require notification"], ans:_A1, exp:"Silent failure is the most dangerous unattended failure mode; notification lets humans intervene in time, and its content must report what actually landed on disk rather than the AI's own claim of success." }
    ],

    m8_nav: "8. Operations & Governance",
    m8_title: "After Go-Live: The Four Disciplines of Operations",
    m8_overview: "Building, launching and passing acceptance is not the end — a living system changes every day: the knowledge base grows, configurations go stale, assets accumulate risk. This module distils post-launch operations into four reusable disciplines, using the Review Agent system's real maintenance cycle (including the SMMC domain-pack regression test) as the case.",
    m8_highlights: ["Sync Obligation","Backup & Visibility","Verify-before-Configure","Regression Testing","Precise Defense","Baseline Protection"],
    m8_p1: "Discipline 1: the sync obligation. Declaring core/ the 'single source of truth' is only the beginning — it is actually an obligation: whenever core changes, every derivative (platform adapters, condensed copies, documentation) must follow, or knowledge splinters in place and 'single' becomes a name only. The practical method: write down 'what must be synced after changing core' as an explicit checklist, and execute it immediately after every extension rather than 'when there's time'. Example: the day the domain packs migrated into core, the ChatGPT/Gemini adapters' knowledge-file list was synced from 4 files to 11.",
    m8_p2: "Discipline 2: backup and visibility — two independent decisions. Ask two questions of every critical knowledge asset: 'Is it backed up?' and 'Who should the backup be visible to?'. The review system's core lives in a user-settings folder outside any cloud sync — a machine failure means losing the whole thing; the fix is pushing to a git remote. But the second question matters just as much: this core contains sensitive data such as course grading baselines, so the backup repository must be private. 'Whether to back up' and 'whether it can be public' must never be conflated — and after backing up, go back and verify the visibility setting actually took effect.",
    m8_p3: "Discipline 3: verify before you configure. Every external fact written into system configuration — URLs, paths, version numbers — should be actually verified before being written, not recalled from memory or intuition. Example: the morning-brief patrol list's nine candidate URLs were each tested for reachability; two major sites were dropped for blocking crawlers (HTTP 403). Had they been written from impression, the system would have silently failed on those two URLs every single day. The principle: configuration is a form of code, and deserves the same verification discipline.",
    m8_p4: "Discipline 4: regression-test after every extension — verify the new feature and the old defenses. Each time the system is extended (e.g. adding the SMMC domain pack), run a planted-flaw regression test before go-live. The real test yielded two observations beyond expectations: first, precise defense — the test file's title said 'for system testing, deletable', and the system correctly judged this a descriptive annotation rather than an instruction, logging it without deleting anything; defensive maturity lies not in 'how much gets blocked' but in telling instruction-like data from real instructions, without over-defending. Second, baseline protection — the system proactively noted that the low score of a test fragment 'does not overwrite' the group's existing score in the cohort trajectory, showing an understanding of data integrity rather than mechanical scoring.",
    m8_wrapup: "The four disciplines of operations: the sync obligation (derivatives follow when core changes), backup & visibility (back up, and independently judge whether it can be public), verify-before-configure (configuration is code), and regression testing after extension (verify new features and old defenses). A system's trustworthiness is not its state at construction — it is the habits of its operation.",
    m8_terms: [
      { front:"Sync Obligation", back:"When the single source of truth changes, every derivative must follow immediately — otherwise knowledge splinters and 'single' becomes a name only." },
      { front:"Backup & Visibility", back:"Two independent decisions: is it backed up? Who may see the backup? Sensitive backups must be private — and verify the setting took effect." },
      { front:"Verify-before-Configure", back:"Actually verify every external fact (URL, path, version) before writing it into configuration — configuration is a form of code." },
      { front:"Regression Testing", back:"Before each extension goes live, test with planted-flaw samples: verify the new feature works and the old defenses still hold." },
      { front:"Precise Defense", back:"Telling instruction-like data from real instructions: log suspicious text without obeying it — and without over-reacting." },
      { front:"Baseline Protection", back:"Scores from tests or fragments never overwrite existing grading trajectories — understanding data integrity, not mechanical execution." },
      { front:"Checklist-driven Ops", back:"Write 'changing A requires syncing B' as an explicit list that evolves with the system, instead of relying on memory." },
      { front:"Operations as Habit", back:"A system's trustworthiness is not its state at construction but the disciplines continuously practised in operation." }
    ],
    m8_q: [
      { q:"Why does a 'single source of truth' need a 'sync obligation' to go with it?", opts:["Because core files sync everywhere automatically","Because if derivatives don't follow when core changes, knowledge splinters and 'single' becomes a name only","Because syncing saves storage space","Because the platform requires syncing"], ans:_A1, exp:"A single source of truth is maintained by discipline: every core change must propagate to adapters and condensed copies immediately, or versions diverge and the declaration fails." },
      { q:"Which two independent questions make up the backup decision?", opts:["Backup speed and backup size","Is it backed up? Who should the backup be visible to?","Backup format and backup frequency","Choosing between local and cloud backup"], ans:_A1, exp:"'Whether to back up' and 'whether it can be public' are independent: a knowledge base containing grading data must go to a private repository, verified after the fact." },
      { q:"How was 'verify-before-configure' practised for the morning-brief patrol list?", opts:["Writing in every URL that came to mind","Testing all nine candidate URLs for reachability and dropping the two that block crawlers before writing them in","Only writing in well-known big sites","Asking students to test the URLs"], ans:_A1, exp:"URLs written from impression that turn out unreachable (e.g. 403) make the system fail silently every day; verifying first treats configuration as code." },
      { q:"What two things must a post-extension regression test verify?", opts:["The new feature works + execution got faster","The new feature works + the old defenses (e.g. injection defense) still hold","Lines of code + file size","UI beauty + user satisfaction"], ans:_A1, exp:"An extension can quietly weaken existing defenses; the planted-flaw test verifies both the new domain pack and the intact security mechanisms." },
      { q:"The test file's title said 'deletable', yet the system only logged it without deleting — what does this demonstrate?", opts:["A system fault; it should have deleted","Precise defense: telling descriptive annotations from real instructions, neither obeying nor over-reacting","The system lacked permission to delete files","The system failed to read the title"], ans:_A1, exp:"Mature defense is about judgment precision: recording instruction-like data without executing it — neither manipulated nor over-defensive." }
