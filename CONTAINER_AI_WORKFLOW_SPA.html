    m9_nav: "9. Publishing Pipeline",
    m9_title: "Case Study: From System to Publication — the Daily Brief Reader",
    m9_overview: "The daily brief used to be just a Markdown file on a hard drive. This module shows how an unattended system's output gets upgraded into a public publication: a semi-automatic pipeline separating production from publishing, split caching for shell versus content, 'render-then-enhance' turning Markdown into a reading experience, and one round of interface iteration driven by real user feedback.",
    m9_highlights: ["Produce/Publish Separation","Semi-automatic Release","Shell/Content Split Caching","Render-then-Enhance","Audience Layering","Two-layer Fixes","Friendly Defense"],
    m9_p1: "Design 1: separate production from publishing. The heartbeat produces the brief automatically every day (unattended), but putting it online is a different matter — it carries the responsibility of speaking publicly. The solution is a semi-automatic pipeline: output lands only on the local machine; after you review it, one click runs the publish script, and deterministic code copies the file, rebuilds the manifest and pushes — live in about two minutes. This joins unattended production with human release-gating into one governed pipeline: what is delegated to the machine is labour; what stays with the human is judgment.",
    m9_p2: "Design 2: caching strategy must follow the nature of the data. The reader's shell (the interface code) uses versioned caching — bump only on redesign; the content (daily briefs) is network-first — always fresh when online, falling back to previously read issues offline. Two strategies coexist in one PWA, and publishing daily content requires no cache bump at all. Contrast this with the course site's whole-site versioning: course material is a low-frequency-update whole; a publication is a high-frequency stream.",
    m9_p3: "Design 3: render-then-enhance. The brief's source stays plain Markdown — a pragmatic concession to the fact that AI output formats drift. The reader first renders Markdown to HTML, then enhances programmatically: sections become cards, tags like [new] and [verify] become badges, domain markers become icons, production metadata and researcher notes fold away. Content and presentation are fully decoupled: redesigning the layout touches no past issue, and old briefs automatically gain the new experience.",
    m9_p4: "Design 4: audience layering, plus the iteration method. One brief serves two audiences — general readers see news cards, while researchers expand the collapsed-by-default 'decision notes' (with a disclaimer shown first). But understand that folding is not secrecy: the raw file remains visible in the public repo, so layout hiding is a reading-flow choice, not a privacy mechanism. Interface iteration is fixed in two layers: the reader side keeps existing content compatible (old briefs benefit immediately) while the production spec constrains future output (new briefs are born compliant) — compatibility for the past and constraint for the future, each doing its own job, so the publication evolves without breaking its history.",
    m9_p5: "Every one of the three post-launch retrofits was found by the user, not by an audit. Design 5 added friendly defense (selectable text, Ctrl+P/S left open, graceful copyright toasts on image and blank right-clicks) and carried two governance lessons: sibling sites must keep their defense policies consistent, and an undisclosed trade-off decides on the user's behalf. Design 6 tackled something subtler — over eleven issues the share of bold text drifted from 2.8% to 50.4%, because the SOP asks each brief to be compared against yesterday's and the AI referenced yesterday's style along with its facts. The general rule: any system that uses its own previous output as today's reference will drift.",
    m9_p6: "Design 7 adds voice guidance to the publication — seemingly one more play button, but in fact a new output channel, and a channel changes what survives and what is quietly dropped. First lesson: measure the volume before designing. A full issue runs about 127 minutes read aloud and a topic section averages 18, while a single item at roughly 4 minutes is the only unit anyone finishes — so two tiers became three. Volume is not an implementation detail; it dictates the information architecture. Second lesson: a new channel must carry the old caveats. The verification badges and the folded disclaimer vanish in audio, so a disclaimer is spoken before every playback and the verification marker is kept audible — when you change the form of presentation, the qualifiers are the first thing to disappear silently.",
    m9_pts: [
      { h:"Design 6: three wrong levers, and the one that worked", items:[
        { t:"First - bold weight 700 to 600", d:"No effect at all. The CJK fallback face ships only Regular and Bold, so anything above 500 snaps back to Bold; ink counted in a canvas is identical at 600 and 700." },
        { t:"Second - drop to 400, let colour carry it", d:"An overcorrection. The emphasis colour measures only 1.24 contrast against body text, effectively invisible, especially in light mode." },
        { t:"Third - add a faint tint", d:"Still the same wall. 63% of the text stayed marked; only the paint changed. All three altered HOW things were marked when the problem was HOW MUCH." },
        { t:"What worked - an emphasis budget", d:"A 20% budget taken from the reference issue, with over-budget documents demoting their longest runs first. Short runs are keywords and figures; long runs are whole sentences. Every issue converged to about 19%." }
      ]},
      { h:"Design 7: four traps in voice guidance, and their rules", items:[
        { t:"Section buttons showed only an outline", d:"The button colour equalled the heading block's background (gold on gold in dark, green on green in light) - a control inside an already-coloured block should inherit its colour, not hard-code one." },
        { t:"Speed changes felt inert", d:"Calling cancel() still fires the completion event, advancing the queue and double-speaking - an intentional cancel must be distinguished from a natural end." },
        { t:"The header ignored playback started elsewhere", d:"Each button kept its own books - notify state centrally and treat the UI as a projection of it." },
        { t:"Narration scrolled to blank space", d:"The first item sat inside a collapsed fold - what you narrate or scroll to may be hidden, so make it visible first." },
        { t:"Returning: one rule beats three special cases", d:"Finishing returns to the start of what was narrated by capturing an anchor when playback begins; only a natural finish scrolls back, while pressing stop leaves the view alone." }
      ]},
      { h:"Closing: your ruler can lie", items:[
        { t:"Four measurement artifacts", d:"textContent concatenation, a transition read mid-transient, throttled timers in a background tab, and rAF frozen on a page that never composites - each arrived disguised as a bug." },
        { t:"The shared structure", d:"The measuring tool shares an execution environment with what it measures, so the environment's limits get blamed on the code." },
        { t:"Three counters", d:"Cross-check by another method (count ink in a canvas for colour, intercept scrollTo for scrolling); verify the ruler itself moves; and when checking results, confirm the ruler is accurate." }
      ]}
    ],
    m9_wrapup: "Seven designs take a system's output to a publication: produce/publish separation, caching split by data nature, render-then-enhance, audience layering, friendly defense, an emphasis budget, and voice guidance. Three methods run through them: two-layer fixing (display side for the past, spec side for the future), measuring rather than hard-coding (judge by actual content, not a list of dates), and one rule beating three special cases. The last lesson is that your ruler can lie — when the measuring tool shares an execution environment with what it measures, the environment's limits masquerade as defects in the code.",
    m9_terms: [
      { front:"Produce/Publish Separation", back:"Unattended systems produce; humans review and release — the responsibility of public speech stays with people." },
      { front:"Semi-automatic Release", back:"One click after review: a deterministic script copies, rebuilds the manifest and pushes — humans judge, scripts labour." },
      { front:"Shell/Content Split Caching", back:"Versioned cache for the shell, network-first for content — daily publishing needs no cache bump." },
      { front:"Render-then-Enhance", back:"Keep the source as Markdown; the reader renders then adds cards, badges and folds — content decoupled from presentation." },
      { front:"Audience Layering", back:"One document serves different readers via folded blocks: cards for general readers, expandable notes for researchers." },
      { front:"Folding ≠ Secrecy", back:"The raw file in a public repo stays visible; layout hiding is a flow choice, not a privacy mechanism." },
      { front:"Two-layer Fixes", back:"Display side keeps existing content compatible (old issues benefit now); production spec constrains future output (new issues born compliant)." },
      { front:"rAF Hidden-tab Trap", back:"requestAnimationFrame is bound to the render loop and freezes in hidden tabs; throttle non-render logic with timers." },
      { front:"Friendly Defense", back:"Protect IP without hindering learning: text stays selectable, Ctrl+P/S stay open; image/blank right-clicks get a graceful copyright toast." },
      { front:"Disclosed Trade-offs", back:"Deliberate design omissions must be surfaced for the human to rule on — an undisclosed trade-off decides on the user's behalf." },
      { front:"Self-referential Drift", back:"A system referencing its own previous output will drift: bold went 2.8% → 50.4% in 11 days. Compare facts, not style." },
      { front:"The Wrong Lever", back:"Weight, colour and tint all failed — the problem was never HOW things were marked but HOW MUCH." },
      { front:"Total vs Distribution", back:"The total says 'something is wrong'; the distribution says 'which part to cut': median 9 vs 29 chars, max 51 vs 220 — long runs are the wall." },
      { front:"Emphasis Budget", back:"A 20% budget with longest-first demotion guarantees the outcome lands inside the target and lets the distribution decide what is sacrificed." },
      { front:"Volume Dictates Architecture", back:"127 minutes for a full read, ~4 for one item — volume is not an implementation detail; it decides how many tiers the information needs." },
      { front:"A New Channel Carries Old Caveats", back:"Audio erases 待查核 badges and disclaimers: speak the disclaimer first, skip decorative badges, keep the verification marker audible." },
      { front:"Inherit Colour, Don't Hard-code", back:"Controls inside an already-coloured block should use color:inherit — hard-coding yields gold on gold, green on green, and a bare outline." },
      { front:"Cancel Is Not Completion", back:"cancel() still fires the completion event, advancing the queue and double-speaking. Distinguish the two in any abortable async flow." },
      { front:"Notify State Centrally", back:"The UI is a projection of state, not per-button bookkeeping — otherwise the header ignores playback started elsewhere." },
      { front:"Your Ruler Can Lie", back:"textContent concatenation, transition transients, throttled background timers, frozen rAF — tool limits masquerade as code defects. Cross-check by another method." }
    ],
    m9_q: [
      { q:"Why is brief publishing semi-automatic rather than fully automatic?", opts:["Because a fully automatic script couldn't be written","The responsibility of public speech stays with the human: machines do the production labour, a person reviews and releases","Because GitHub forbids automated pushes","To save computing costs"], ans:_A1, exp:"Unattended systems can be trusted with production, but going public carries speech responsibility — semi-automation is a governance choice, not a technical limit." },
      { q:"Why does the reader serve brief content network-first instead of versioned caching?", opts:["Because versioned caching is more expensive","High-frequency content should be fresh when online and fall back offline, and daily publishing then needs no cache bump","Because Markdown files cannot be cached","Because readers don't need offline support"], ans:_A1, exp:"Caching follows data nature: the shell changes rarely (versioned), the content is a daily stream (network-first), making publication cache-free." },
      { q:"What is the core benefit of 'render-then-enhance'?", opts:["Faster page loads","Fewer lines of code","Content decoupled from presentation: redesigns touch no past issue, and old briefs gain the new experience automatically","No need to use Markdown"], ans:_A2, exp:"Source stays plain Markdown while the reader post-processes presentation — layout evolution and content history never constrain each other." },
      { q:"What does folding the researcher notes provide — and not provide?", opts:["Secrecy but not convenience","A layered reading flow, but not secrecy (the raw file stays visible in the public repo)","Encryption but not search","Access control but not offline reading"], ans:_A1, exp:"Folding simplifies the flow for general readers; real access restriction requires a different architecture, not interface hiding." },
      { q:"How is the 'two-layer fix' divided?", opts:["Half frontend, half backend","Display side keeps existing content compatible; the production spec (SOP) constrains future output","Easy fixes first, hard fixes later","Users fix content, developers fix code"], ans:_A1, exp:"The reader gives old briefs the fix immediately; the SOP makes new briefs compliant at the source — compatibility for the past, constraint for the future." },
      { q:"What two governance lessons came from retrofitting friendly defense onto the reader?", opts:["More defense is always better, speed second","Sibling sites' defense policies must stay consistent (audited on the ops checklist), and deliberate trade-offs must be disclosed for the human to rule on","Defense and reading experience inevitably conflict","Only paid websites need defense mechanisms"], ans:_A1, exp:"The gap was found by the user, not an audit — parity needs a checklist, not luck; the omission was an undiscussed deliberate trade-off — agents should surface design omissions and leave the ruling to the human."},
      { q:"Bold rose from 2.8% to 50.4% over eleven issues. What caused it?", opts:["A model update changed the writing style","The SOP asks each brief to be compared against yesterday's, so the AI referenced yesterday's STYLE too, treating its bold density as the standard and adding more — a self-referential feedback loop","A CSS mistake on the reader site","A bug in the Markdown parser"], ans:_A1, exp:"Any system using its own previous output as today's reference will drift. Comparison is for facts and progress, not style — and that must be written down, because it does not hold by itself." },
      { q:"Why did changing bold from weight 700 to 600 have no effect at all?", opts:["The CSS was never applied","The CJK fallback face ships only Regular and Bold, so anything above 500 snaps back to Bold","The browser cache was not cleared","Font weight only affects Latin text"], ans:_A1, exp:"The computed value really was 600 — the setting worked. But drawing the text into a canvas and counting ink shows 600 and 700 are identical, and only 400 is 34% lighter: checking the setting is not checking the result." },
      { q:"Weight, colour and tint all failed. What was the shared mistake?", opts:["None of them cleared the cache","All changed HOW things were marked when the problem was HOW MUCH — 63% of the text stayed marked throughout","None handled both languages","All were display-side rather than production-side"], ans:_A1, exp:"Changing the paint does not shrink the wall. What worked was giving emphasis a budget and demoting over-budget runs, which reduces the marked area itself." },
      { q:"Why examine the length DISTRIBUTION of bold runs rather than just the total?", opts:["The total is hard to compute","The total says 'something is wrong'; the distribution says 'which part to cut' — median 9→29 chars, max 51→220 — long runs are the wall","Distributions are easier to visualise","The total varies with screen width"], ans:_A1, exp:"Short runs are keywords and figures that carry information; long runs are whole sentences. Aggregate metrics alone often send you to the wrong lever." },
      { q:"Why does 'budget plus longest-first demotion' beat 'threshold plus style switch'?", opts:["The code is shorter","The budget guarantees the outcome lands inside the target while the priority decides what is sacrificed; a threshold can only split in two and still needs a style per bucket","It requires no measurement","It allows hard-coding a list of dates"], ans:_A1, exp:"Every issue converged to ~19% in a single treatment — real bold. Judging by measured density rather than dates means future drift is handled automatically and compliant issues are never touched." },
      { q:"Why did voice guidance move from two tiers to three (digest / topic / item)?", opts:["Three tiers simply look better","Measurement showed 127 minutes for a full read and 18 per topic, while a single item at ~4 minutes is the only unit anyone finishes","Browsers cap navigation at three levels","The user asked for three buttons"], ans:_A1, exp:"Volume is not an implementation detail; it dictates the information architecture. Measure first, then design." },
      { q:"Why must a disclaimer be spoken and 待查核 kept audible when adding narration?", opts:["To make the audio longer","Because the on-screen badges and disclaimer box vanish in audio, leaving listeners unable to tell what was never verified","Because the law requires spoken disclaimers","Because the TTS engine needs warm-up text"], ans:_A1, exp:"When you change the form of presentation, the qualifiers are the first thing to disappear silently — the same shape as 'folding is not secrecy'." },
      { q:"Section play buttons showed only their outline. What was the cause and the rule?", opts:["The glyph was too small; enlarge it","The button's colour equalled the heading block's background; controls inside an already-coloured block should inherit colour rather than hard-code it","The browser lacked the glyph; use an image","CSS load order was wrong; reorder it"], ans:_A1, exp:"Gold on gold in dark, green on green in light. color:inherit makes the button match the heading's own text colour, correct in both themes by construction." },

      { q:"Several 'bugs' in this project turned out to be measurement artifacts. What is the shared structure?", opts:["The code was too complex","The measuring tool shares an execution environment with what it measures, so the environment's limits get blamed on the code","The browser was outdated","There was too little test data"], ans:_A1, exp:"textContent concatenation, transition transients, throttled background timers and frozen rAF all belong here. Cross-check by another method, and confirm the ruler itself works." }

const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));

  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const startIdx = groupIdx * groupSize;
  const currentCardIndices = shuffledOrder.slice(startIdx, startIdx + groupSize);

  useEffect(() => {
    const newShown = new Set(shownSet);
    currentCardIndices.forEach(idx => newShown.add(idx));
    if (newShown.size !== shownSet.size) setShownSet(newShown);
  }, [groupIdx]);

  const handleFlip = (origIdx) => {
    setFlipped(f => ({ ...f, [origIdx]: !f[origIdx] }));
    if (!readSet.has(origIdx)) {
      const newRead = new Set(readSet); newRead.add(origIdx); setReadSet(newRead);
      if (onCardRead) onCardRead(moduleId, newRead.size, shownSet.size, terms.length);
    }
  };

  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);

  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map((origIdx) => {
          const term = terms[origIdx];
          return (
            <div key={origIdx} className="perspective cursor-pointer h-36" onClick={() => handleFlip(origIdx)}>
              <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[origIdx] ? 'rotate-y-180' : ''}`}>
                <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                  <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{term.front}</p>
                  <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
                </div>
                <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center">
                  <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{term.back}</p>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }}
          className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
          {t.flip_retry}

          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">

const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit, moduleName }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;

  const [quizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);

  const [shuffledMaps] = useState(() => quizIndices.map(qIdx => {
    const n = questions[qIdx].opts.length;
    return [...Array(n).keys()].sort(() => Math.random() - 0.5);
  }));

  const totalAnswered = Object.keys(selected).length;
  const computeCorrect = () => {
    let c = 0;
    quizIndices.forEach((qIdx, qi) => {
      if (selected[qi] === undefined) return;
      if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++;
    });
    return c;
  };
  const statusText = t.quiz_status.replace('{correct}', computeCorrect()).replace('{answered}', totalAnswered).replace('{total}', quizIndices.length);

  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);

  const handleGroupSubmit = () => {
    const allDone = currentIndices.every((_, i) => selected[currentStart + i] !== undefined);
    if (!allDone) return;
    setSubmitted(s => ({ ...s, [groupIdx]: true }));
    if (groupIdx === totalGroups - 1) {
      const wrongQs = [];
      let correct = 0;
      quizIndices.forEach((qIdx, qi) => {
        if (selected[qi] === undefined) return;
        if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++;
        else wrongQs.push(questions[qIdx].q);
      });
      onQuizSubmit(moduleId, correct, quizIndices.length, wrongQs, moduleName);
    }
  };

  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI;
        const q = questions[qIdx];
        const sMap = shuffledMaps[qi];
        const isGrpSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3">{qi+1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans);
                const isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isGrpSub && setSelected(s => ({...s, [qi]: dIdx}))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm ${
                      isGrpSub
                        ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30'
                          : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                        : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'
                    }`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isGrpSub && (
              <p className={`mt-2 text-sm italic ${shuffledMaps[qi][selected[qi]] === _d(q.ans) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit}
              disabled={!currentIndices.every((_,i) => selected[currentStart+i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">
              {t.submit}
            </button>
          : <>
              {groupIdx < totalGroups-1 && (
                <button onClick={() => setGroupIdx(groupIdx+1)}
                  className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">
                  {t.quiz_next}
                </button>
              )}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }}
                className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">
                {t.quiz_retry}
              </button>
            </>
        }
      </div>
    </div>
  );
};

const SandboxRiskLab = ({t}) => {
  const [risk, setRisk] = useState(50);
  const [sandboxOn, setSandboxOn] = useState(true);
  const color = risk < 34 ? '#22c55e' : risk < 67 ? '#eab308' : '#ef4444';
  const coreColor = sandboxOn ? '#22c55e' : color;
  const coreMsg = sandboxOn ? t.mlab_risk_safe : t.mlab_risk_danger;

  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.mlab_risk_title}</h3>
      <p className="text-sm text-slate-500 mb-4">{t.mlab_risk_desc}</p>
      <label className="text-sm block mb-2">{t.mlab_risk_slider}: {risk}</label>
      <input type="range" min="0" max="100" value={risk} onChange={e=>setRisk(Number(e.target.value))} className="w-full mb-4" />
      <button onClick={()=>setSandboxOn(!sandboxOn)} className={`mb-4 px-4 py-2 rounded-lg text-sm font-bold ${sandboxOn ? 'bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030]' : 'border border-slate-300 dark:border-slate-600'}`}>
        {t.mlab_risk_toggle}: {sandboxOn ? 'ON' : 'OFF'}
      </button>
      <div className="grid grid-cols-2 gap-4">
        <div className="rounded-xl p-4 border-2 text-center" style={{borderColor: color}}>
          <p className="text-xs uppercase tracking-wider text-slate-400 mb-2">{t.mlab_risk_sandbox_label}</p>
          <div className="h-16 rounded-lg flex items-center justify-center font-bold text-white" style={{backgroundColor: color}}>{risk}%</div>
        </div>
        <div className="rounded-xl p-4 border-2 text-center" style={{borderColor: coreColor}}>
          <p className="text-xs uppercase tracking-wider text-slate-400 mb-2">{t.mlab_risk_core}</p>
          <div className="h-16 rounded-lg flex items-center justify-center font-bold text-white" style={{backgroundColor: coreColor}}>{sandboxOn ? '0%' : risk+'%'}</div>
        </div>
      </div>
      <p className={`text-sm mt-4 ${sandboxOn ? 'text-green-600 dark:text-green-400' : 'text-red-500'}`}>{coreMsg}</p>
    </div>
  );
};

/* ---------- App ---------- */
function App() {
  const LS_KEY = 'CAIW_SPA_analytics';
  const LS_STU = 'CAIW_SPA_student';
  const loadLS = (key, fb) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch { return fb; } };

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group:'', dept:'', id:'', nameEn:'', nameZh:'' }));
  const [analytics, setAnalytics] = useState(() => {
    const fb = {
      time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
      quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
      cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0),
      wrongTopics: {}
    };
    const saved = loadLS(LS_KEY, fb);
    // 模組數擴充後，補齊舊版 localStorage 中長度不足的陣列
    const pad = (arr) => { const x = Array.isArray(arr) ? [...arr] : []; while (x.length < TOTAL) x.push(0); return x.slice(0, TOTAL); };
    return {
      time: pad(saved.time), clicks: pad(saved.clicks),
      quizCorrect: pad(saved.quizCorrect), quizTotal: pad(saved.quizTotal),
      cardsRead: pad(saved.cardsRead), cardsTotal: pad(saved.cardsTotal),
      wrongTopics: saved.wrongTopics || {}
    };
  });
  const contentRef = useRef(null);
  const menuRef = useRef(null);
  const t = dict[lang];

  /* ---- PWA install button ---- */
  const deferredPromptRef = useRef(null);
  const isIOSSafariRef = useRef(false);
  const isMacSafariRef = useRef(false);
  const [canInstall, setCanInstall] = useState(false);
  const [isStandaloneMode, setIsStandaloneMode] = useState(false);
  const [installToast, setInstallToast] = useState(null);
  const installToastTimerRef = useRef(null);

  const showInstallToast = (msg, duration = 4000) => {
    setInstallToast(msg);
    if (installToastTimerRef.current) clearTimeout(installToastTimerRef.current);
    installToastTimerRef.current = setTimeout(() => setInstallToast(null), duration);
  };

  useEffect(() => {
    const ua = navigator.userAgent;
    const iOS = /iphone|ipad|ipod/i.test(ua) && !window.MSStream;
    const safari = /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);
    isIOSSafariRef.current = iOS && safari;
    isMacSafariRef.current = !iOS && safari && /macintosh/i.test(ua);

    setIsStandaloneMode(
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true
    );

    const onBeforeInstall = (e) => {
      e.preventDefault();
      deferredPromptRef.current = e;
      setCanInstall(true);
    };
    const onInstalled = () => {
      deferredPromptRef.current = null;
      setCanInstall(false);
      setIsStandaloneMode(true);
    };
    window.addEventListener('beforeinstallprompt', onBeforeInstall);
    window.addEventListener('appinstalled', onInstalled);
    return () => {
      window.removeEventListener('beforeinstallprompt', onBeforeInstall);
      window.removeEventListener('appinstalled', onInstalled);
    };
  }, []);

  const showInstallBtn = !isStandaloneMode && (canInstall || isIOSSafariRef.current || isMacSafariRef.current);

  const handleInstallClick = async () => {
    if (deferredPromptRef.current) {
      deferredPromptRef.current.prompt();
      try { await deferredPromptRef.current.userChoice; } catch (e) {}
      deferredPromptRef.current = null;
      setCanInstall(false);
    } else if (isIOSSafariRef.current) {
      showInstallToast(lang === 'zh' ? '點擊分享按鈕，選擇「加入主畫面」' : 'Tap the Share button, then choose "Add to Home Screen"');
    } else if (isMacSafariRef.current) {
      showInstallToast(lang === 'zh' ? '使用選單列：檔案 → 加入 Dock' : 'Use the menu bar: File → Add to Dock');
    }
  };

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(analytics)); } catch {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch {} }, [studentInfo]);

  useEffect(() => {
    const timer = setInterval(() => {
      setAnalytics(a => { const time = [...a.time]; time[module] = (time[module]||0) + 1; return {...a, time}; });
    }, 1000);
    return () => clearInterval(timer);
  }, [module]);

  useEffect(() => {
    const handleClick = () => setAnalytics(a => { const clicks = [...a.clicks]; clicks[module] = (clicks[module]||0) + 1; return {...a, clicks}; });
    const node = contentRef.current;
    if (node) node.addEventListener('click', handleClick);
    return () => { if (node) node.removeEventListener('click', handleClick); };
  }, [module]);

  useEffect(() => {
    const handleOutside = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', handleOutside);
    return () => document.removeEventListener('mousedown', handleOutside);
  }, []);

  const handleQuizSubmit = (mid, correct, total, wrongQs) => {
    setAnalytics(a => {
      const qc = [...a.quizCorrect], qt = [...a.quizTotal];
      qc[mid] = correct; qt[mid] = total;
      const wt = { ...a.wrongTopics }; wt[mid] = wrongQs || [];
      return { ...a, quizCorrect: qc, quizTotal: qt, wrongTopics: wt };
    });
  };
  const handleCardRead = (mid, readCount, shownCount, totalCount) => {
    setAnalytics(a => {
      const cr = [...a.cardsRead], ct = [...a.cardsTotal];
      cr[mid] = readCount; ct[mid] = totalCount;
      return { ...a, cardsRead: cr, cardsTotal: ct };
    });
  };

  const modulesList = [
    { id:0, icon:'📋', title:t.m0_nav },
    { id:1, icon:'🧱', title:t.m1_nav },
    { id:2, icon:'🤖', title:t.m2_nav },
    { id:3, icon:'🔄', title:t.m3_nav },
    { id:4, icon:'⚡', title:t.m4_nav },
    { id:5, icon:'🧩', title:t.m5_nav },
    { id:6, icon:'🔍', title:t.m6_nav },
    { id:7, icon:'💓', title:t.m7_nav },
    { id:8, icon:'🛠️', title:t.m8_nav },
    { id:9, icon:'📰', title:t.m9_nav },
    { id:IDX_LAB, icon:'🧪', title:t.mlab_nav },
    { id:IDX_RES, icon:'🌐', title:t.mres_nav },
    { id:IDX_ANA, icon:'📊', title:t.analytics_nav }
  ];

  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { speechSynthesis.cancel(); setTtsState('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTtsState('paused'); return; }
    if (action === 'play') {
      if (ttsState === 'paused') { speechSynthesis.resume(); setTtsState('playing'); return; }
      speechSynthesis.cancel();
      const sep = lang === 'zh' ? '。 ' : '. ';
      let texts = [];
      if (module === 0) {
        texts = [t.m0_title, t.m0_intro, t.m0_why, t.m0_why_desc,
          ...(t.m0_stats||[]).map(s=>`${s.label}: ${s.val}`),
          ...(t.m0_modules||[]).map(m=>`${m.title}. ${m.desc}`)];
      } else if (module >= 1 && module <= NUM_LEARN) {
        const mk = `m${module}`;
        texts = [t[`${mk}_title`], t[`${mk}_overview`], ...(t[`${mk}_highlights`]||[]),
          t[`${mk}_p1`], t[`${mk}_p2`], t[`${mk}_p3`], t[`${mk}_p4`], t[`${mk}_p5`], t[`${mk}_p6`], t[`${mk}_p7`],
          ...(Array.isArray(t[`${mk}_pts`])
                ? t[`${mk}_pts`].flatMap(g => [g.h, ...g.items.map(it => `${it.t}。${it.d}`)])
                : []),
          t[`${mk}_wrapup`],
          ...(t[`${mk}_terms`]||[]).flatMap(tm=>[tm.front, tm.back])];
      } else if (module === IDX_LAB) {
        texts = [t.mlab_title, t.mlab_desc, ...(t.mlab_labs||[]).map(l=>`${l.title}. ${l.desc||''}`)];
      } else if (module === IDX_RES) {
        texts = [t.mres_title, t.mres_desc];
      } else if (module === IDX_ANA) {
        const tc = analytics.quizCorrect.reduce((a,b)=>a+b,0);
        const ta = analytics.quizTotal.reduce((a,b)=>a+b,0);
        const oa = ta>0 ? Math.round(tc/ta*100) : 0;
        const wk = [];
        for (let i=1;i<=NUM_LEARN;i++) {
          if (analytics.quizTotal[i]>0) {
            const acc = Math.round(analytics.quizCorrect[i]/analytics.quizTotal[i]*100);
            if (acc<75) wk.push({name:t[`m${i}_title`],acc});
          }
        }
        wk.sort((a,b)=>a.acc-b.acc);
        texts = [t.analytics_title, t.analytics_desc,
          `${t.analytics_total_time}: ${analytics.time.reduce((a,b)=>a+b,0)}${t.analytics_sec}`,
          `${t.analytics_total_clicks}: ${analytics.clicks.reduce((a,b)=>a+b,0)}${t.analytics_times}`,
          `${t.analytics_overall_acc}: ${oa}%`];
        if (wk.length) { texts.push(t.analytics_wp_tts_intro); wk.forEach(w=>texts.push(t.analytics_wp_tts_module.replace('{name}',w.name).replace('{acc}',w.acc))); }
        else if (ta>0) texts.push(t.analytics_wp_tts_allpass);
      }
      texts = texts.filter(Boolean);
      const utt = new SpeechSynthesisUtterance(texts.join(sep));
      utt.rate = 0.95;
      const voices = speechSynthesis.getVoices();
      if (lang==='zh') {
        const v = voices.find(v=>v.lang==='zh-TW'&&v.name.includes('Yating'))||voices.find(v=>v.lang==='zh-TW')||voices.find(v=>v.lang.startsWith('zh'));
        if (v) utt.voice = v; utt.lang = 'zh-TW';
      } else {
        const v = voices.find(v=>v.lang==='en-GB'&&(v.name.includes('Male')||v.name.includes('Daniel')))||voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'));
        if (v) utt.voice = v; utt.lang = 'en-GB';
      }
      utt.onend = () => setTtsState('idle');
      utt.onerror = () => setTtsState('idle');
      speechSynthesis.speak(utt);
      setTtsState('playing');
    }
  };

  const goTo = (m) => { setModule(m); window.scrollTo({top:0,behavior:'smooth'}); };

  const exportCSV = () => {
    const rows = [['Module','Time(s)','Clicks','Correct','Total','Accuracy%','Cards Read','Cards Total','Wrong Questions']];
    const titleFor = (i) => i===0?t.m0_title : i<=NUM_LEARN?t[`m${i}_title`] : i===IDX_LAB?t.mlab_title : i===IDX_RES?t.mres_title : t.analytics_title;
    for (let i=0;i<TOTAL;i++) {
      const acc = analytics.quizTotal[i]>0 ? Math.round(analytics.quizCorrect[i]/analytics.quizTotal[i]*100) : '';
      const wrong = (analytics.wrongTopics[i]||[]).join(' | ').replace(/"/g,"'");
      rows.push([titleFor(i), analytics.time[i]||0, analytics.clicks[i]||0, analytics.quizCorrect[i]||0, analytics.quizTotal[i]||0, acc, analytics.cardsRead[i]||0, analytics.cardsTotal[i]||0, `"${wrong}"`]);
    }
    const meta = [['Group',studentInfo.group],['Dept',studentInfo.dept],['ID',studentInfo.id],['Name(EN)',studentInfo.nameEn],['Name(ZH)',studentInfo.nameZh],[]];
    const csv = [...meta, ...rows].map(r=>r.join(',')).join('\n');
    const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${dict.zh.brand}${dict.zh.title}_${studentInfo.nameEn}_${studentInfo.nameZh}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const clearHistory = () => {
    if (!window.confirm(t.analytics_wp_clear_confirm)) return;
    setAnalytics({ time:Array(TOTAL).fill(0), clicks:Array(TOTAL).fill(0), quizCorrect:Array(TOTAL).fill(0), quizTotal:Array(TOTAL).fill(0), cardsRead:Array(TOTAL).fill(0), cardsTotal:Array(TOTAL).fill(0), wrongTopics:{} });
    try { localStorage.removeItem(LS_KEY); } catch(e) {}
  };

  const canExport = studentInfo.group && studentInfo.dept && studentInfo.id && studentInfo.nameEn && studentInfo.nameZh;

  return (
    <div className="min-h-screen bg-[#f4f4f4] dark:bg-[#121212] text-slate-800 dark:text-slate-200 selection:bg-[#004030] selection:text-white dark:selection:bg-[#D8C3A5] dark:selection:text-[#004030] flex flex-col overflow-x-hidden">
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-1 sm:gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(!menuOpen)} className="p-2 hover:bg-white/10 rounded-lg"><IconMenu/></button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-64 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100] text-slate-800 dark:text-slate-200">
                  {modulesList.map(m => (
                    <button key={m.id} onClick={() => { setMenuOpen(false); goTo(m.id); }}
                      className={`w-full flex items-center gap-3 px-4 py-3 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 text-left ${module===m.id ? 'font-bold text-[#004030] dark:text-[#D8C3A5]' : ''}`}>
                      <span>{m.icon}</span><span className="truncate">{m.title}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={() => goTo(0)} className="p-2 hover:bg-white/10 rounded-lg" title={t.nav_home}><IconHome size={18}/></button>
            <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate max-w-[40vw]">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2 shrink-0">
            <button onClick={() => handleTTS(ttsState==='playing' ? 'pause' : 'play')} className="p-2 hover:bg-white/10 rounded-lg" title={t.audio_read}>
              {ttsState==='playing' ? <IconPause size={18}/> : <IconPlay size={18}/>}
            </button>
            <button onClick={() => handleTTS('stop')} className="p-2 hover:bg-white/10 rounded-lg"><IconSquare size={18}/></button>
            <button onClick={() => setLang(lang==='zh'?'en':'zh')} className="p-2 hover:bg-white/10 rounded-lg text-sm font-bold flex items-center gap-1">
              <IconGlobe size={16}/>{lang==='zh'?'EN':'中'}
            </button>
            <button onClick={() => setIsDark(!isDark)} className="p-2 hover:bg-white/10 rounded-lg">{isDark ? <IconSun size={18}/> : <IconMoon size={18}/>}</button>
            {showInstallBtn && (
              <button onClick={handleInstallClick}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-bold text-sm bg-[#D8C3A5] text-[#004030] hover:brightness-95">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><path d="M5 19h14"/>
                </svg>
                <span className="hidden sm:inline">{lang==='zh' ? '安裝應用程式' : 'Install App'}</span>
              </button>
            )}
          </div>
        </div>
      </header>

      {installToast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#004030] text-[#D8C3A5] px-5 py-3 rounded-xl shadow-2xl text-sm z-[200] max-w-[90vw] text-center">
          {installToast}
        </div>
      )}

      <div className="flex-1 flex flex-col md:flex-row max-w-7xl mx-auto w-full pt-16">
        <aside className="hidden md:block w-64 shrink-0 border-r border-slate-200 dark:border-slate-700 p-4">
          {modulesList.map(m => (
            <button key={m.id} onClick={() => goTo(m.id)}
              className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm mb-1 text-left ${module===m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
              <span>{m.icon}</span><span className="truncate">{m.title}</span>
            </button>
          ))}
        </aside>

        <main ref={contentRef} className="flex-1 min-w-0 p-4 md:p-8">

          {module === 0 && (
            <div className="animate-fade-in">
              <div className="rounded-2xl bg-gradient-to-br from-[#004030] to-[#00291f] dark:from-slate-800 dark:to-slate-900 text-white p-8 md:p-12 mb-8">
                <p className="text-[#D8C3A5] text-sm font-bold uppercase tracking-widest mb-3">{t.brand} · {t.subtitle}</p>
                <h1 className="font-serif font-black text-3xl md:text-5xl mb-4">{t.m0_title}</h1>
                <p className="text-white/80 max-w-2xl leading-relaxed mb-6">{t.m0_intro}</p>
                <button onClick={() => goTo(1)} className="px-6 py-3 bg-[#D8C3A5] text-[#004030] font-bold rounded-lg hover:bg-white transition-colors">
                  {t.m0_start}
                </button>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                {t.m0_stats.map((s,i) => (
                  <div key={i} className="bg-white dark:bg-slate-800 rounded-xl p-5 text-center border border-slate-200 dark:border-slate-700">
                    <p className="text-3xl font-black font-serif text-[#004030] dark:text-[#D8C3A5]">{s.val}</p>
                    <p className="text-xs text-slate-500 mt-1">{s.label}</p>
                  </div>
                ))}
              </div>
              <div className="bg-slate-100 dark:bg-slate-800 rounded-xl p-6 mb-10">
                <h2 className="font-serif font-bold text-xl mb-2">{t.m0_why}</h2>
                <p className="text-slate-600 dark:text-slate-300 leading-relaxed">{t.m0_why_desc}</p>
              </div>
              <div className="space-y-3">
                {t.m0_modules.map((m,i) => (
                  <button key={i} onClick={() => goTo(i+1)}
                    className="w-full flex items-center gap-4 p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-[#004030] dark:hover:border-[#D8C3A5] transition-all text-left">
                    <span className="font-serif font-black text-2xl text-[#D8C3A5]">{m.num}</span>
                    <div className="flex-1">
                      <p className="font-bold">{m.title}</p>
                      <p className="text-sm text-slate-500">{m.desc}</p>
                    </div>
                    <IconChevronRight/>
                  </button>
                ))}
              </div>
            </div>
          )}

          {module >= 1 && module <= NUM_LEARN && (
            <div className="space-y-6 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
              <H2 icon={modulesList[module].icon} number={module}>{t[`m${module}_title`]}</H2>
              <div className="bg-[#004030]/5 dark:bg-[#D8C3A5]/5 rounded-xl p-5 border-l-4 border-[#D8C3A5]">
                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2">{t.overview_label}</h3>
                <p>{t[`m${module}_overview`]}</p>
              </div>
              <div>
                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">{t.highlights_label}</h3>
                <div className="flex flex-wrap gap-2">
                  {t[`m${module}_highlights`].map((h,i) => (
                    <span key={i} className="px-3 py-1 bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] rounded-full text-sm font-medium">{h}</span>
                  ))}
                </div>
              </div>
              <div>
                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">{t.deep_dive_label}</h3>
                {/* space-y-5：外層的 space-y-6 只作用於直接子元素，段落包在這層裡本來沒有間隔 */}
                <div className="space-y-5">
                <p>{t[`m${module}_p1`]}</p>
                <p className="p-4 bg-slate-100 dark:bg-slate-800 rounded-lg italic font-serif">{t[`m${module}_p2`]}</p>
                <p>{t[`m${module}_p3`]}</p>
                {t[`m${module}_p4`] && <p>{t[`m${module}_p4`]}</p>}
                {t[`m${module}_p5`] && <p>{t[`m${module}_p5`]}</p>}
                {t[`m${module}_p6`] && <p>{t[`m${module}_p6`]}</p>}
                {t[`m${module}_p7`] && <p>{t[`m${module}_p7`]}</p>}
                {/* 結構化要點：條列式內容不再壓平成長段散文，與 KB 的表格結構對齊 */}
                {Array.isArray(t[`m${module}_pts`]) && t[`m${module}_pts`].map((g, gi) => (
                  <div key={gi} className="pt-1">
                    <h4 className="font-serif font-bold text-base text-[#004030] dark:text-[#D8C3A5] mb-2">{g.h}</h4>
                    <ul className="space-y-2">
                      {g.items.map((it, ii) => (
                        <li key={ii} className="pl-3 border-l-2 border-[#D8C3A5]/70 dark:border-[#004030]">
                          <span className="font-bold text-base">{it.t}</span>
                          <span className="block text-base opacity-90 leading-relaxed">{it.d}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                ))}
                </div>
              </div>
              <div className="flex justify-center text-[#004030] dark:text-[#D8C3A5] py-4">
                {module===1 && <LayeredDiagram lang={lang}/>}
                {module===2 && <SquadDiagram lang={lang}/>}
                {module===3 && <PipelineDiagram lang={lang}/>}
                {module===4 && <TemplateDiagram lang={lang}/>}
                {module===5 && <AgentAnatomyDiagram lang={lang}/>}
                {module===6 && <ReviewAgentDiagram lang={lang}/>}
                {module===7 && <HeartbeatDiagram lang={lang}/>}
                {module===8 && <OpsLoopDiagram lang={lang}/>}
                {module===9 && <PublishPipelineDiagram lang={lang}/>}
              </div>
              <FlipCardDeck key={`cards-${module}`} terms={t[`m${module}_terms`]} t={t} moduleId={module} onCardRead={handleCardRead} />
              <div className="bg-slate-100 dark:bg-slate-800 rounded-xl p-5">
                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2">{t.wrapup_label}</h3>
                <p className="italic">{t[`m${module}_wrapup`]}</p>
              </div>
              <ModuleQuiz key={`quiz-${module}`} questions={t[`m${module}_q`]} t={t} moduleId={module} onQuizSubmit={handleQuizSubmit} moduleName={t[`m${module}_title`]} />
            </div>
          )}

          {module === IDX_LAB && (
            <div className="space-y-6 animate-fade-in">
              <H2 icon="🧪" number={IDX_LAB}>{t.mlab_title}</H2>
              <p className="text-lg text-slate-600 dark:text-slate-300">{t.mlab_desc}</p>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                {t.mlab_labs.map((l,i) => (
                  <div key={i} className="bg-slate-50 dark:bg-slate-900/50 rounded-xl p-4 border border-slate-200 dark:border-slate-700">
                    <p className="font-bold text-[#004030] dark:text-[#D8C3A5]">{l.title}</p>
                    <p className="text-sm text-slate-500 mt-1">{l.desc}</p>
                  </div>
                ))}
              </div>
              <StepOrderLab lang={lang} t={t} />
              <ConceptMatchLab lang={lang} t={t} />
              <PromptGeneratorLab lang={lang} t={t} />
              <SandboxRiskLab t={t} />
            </div>
          )}

          {module === IDX_RES && (
            <div className="space-y-8 animate-fade-in">
              <H2 icon="🌐" number={IDX_RES}>{t.mres_title}</H2>
              <p className="text-lg text-slate-600 dark:text-slate-300">{t.mres_desc}</p>
              {RESOURCES.map((g,i) => (
                <div key={i}>
                  <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">{t[g.group]}</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {g.items.map((it,j) => <LinkCard key={j} label={it.label} url={it.url} desc={it.desc[lang]} />)}
                  </div>
                </div>
              ))}
            </div>
          )}

          {module === IDX_ANA && (() => {
            const totalTime = analytics.time.reduce((a,b)=>a+b,0);
            const totalClicks = analytics.clicks.reduce((a,b)=>a+b,0);
            const totalCorrect = analytics.quizCorrect.reduce((a,b)=>a+b,0);
            const totalQuiz = analytics.quizTotal.reduce((a,b)=>a+b,0);
            const overallAcc = totalQuiz>0 ? Math.round(totalCorrect/totalQuiz*100) : 0;
            const totalCardsRead = analytics.cardsRead.reduce((a,b)=>a+b,0);
            const totalCardsTotal = analytics.cardsTotal.reduce((a,b)=>a+b,0);
            const cardUsage = totalCardsTotal>0 ? Math.round(totalCardsRead/totalCardsTotal*100) : 0;
            const weakPoints = [];
            for (let i=1;i<=NUM_LEARN;i++) {
              if (analytics.quizTotal[i]>0) {
                const acc = Math.round(analytics.quizCorrect[i]/analytics.quizTotal[i]*100);
                if (acc<75) weakPoints.push({ id:i, name:t[`m${i}_title`], acc });
              }
            }
            weakPoints.sort((a,b)=>a.acc-b.acc);

            return (
              <div className="space-y-8 animate-fade-in">
                <H2 icon="📊" number={IDX_ANA}>{t.analytics_title}</H2>
                <p className="text-lg text-slate-600 dark:text-slate-300">{t.analytics_desc}</p>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-white dark:bg-slate-800 rounded-xl p-5 text-center border border-slate-200 dark:border-slate-700">
                    <p className="text-2xl font-black font-serif text-[#004030] dark:text-[#D8C3A5]">{totalTime}{t.analytics_sec}</p>
                    <p className="text-xs text-slate-500 mt-1">{t.analytics_total_time}</p>
                  </div>
                  <div className="bg-white dark:bg-slate-800 rounded-xl p-5 text-center border border-slate-200 dark:border-slate-700">
                    <p className="text-2xl font-black font-serif text-[#004030] dark:text-[#D8C3A5]">{totalClicks}{t.analytics_times}</p>
                    <p className="text-xs text-slate-500 mt-1">{t.analytics_total_clicks}</p>
                  </div>
                  <div className="bg-white dark:bg-slate-800 rounded-xl p-5 text-center border border-slate-200 dark:border-slate-700">
                    <p className="text-2xl font-black font-serif text-[#004030] dark:text-[#D8C3A5]">{overallAcc}%</p>
                    <p className="text-xs text-slate-500 mt-1">{t.analytics_overall_acc}</p>
                  </div>
                  <div className="bg-white dark:bg-slate-800 rounded-xl p-5 text-center border border-slate-200 dark:border-slate-700">
                    <p className="text-2xl font-black font-serif text-[#004030] dark:text-[#D8C3A5]">{cardUsage}%</p>
                    <p className="text-xs text-slate-500 mt-1">{t.analytics_card_usage}</p>
                  </div>
                </div>

                <div>
                  <h3 className="font-serif font-bold text-lg mb-3">{t.analytics_progress_title}</h3>
                  <div className="space-y-2">
                    {Array.from({length:NUM_LEARN}).map((_,idx) => {
                      const i = idx+1;
                      const visited = (analytics.cardsTotal[i]||0) > 0 || (analytics.quizTotal[i]||0) > 0 || (analytics.time[i]||0) > 0;
                      const quizDone = (analytics.quizTotal[i]||0) > 0;
                      const pct = visited ? (quizDone ? 100 : 50) : 0;
                      return (
                        <button key={i} onClick={() => goTo(i)}
                          className="w-full text-left flex items-center gap-3 p-3 bg-slate-50 dark:bg-slate-900/50 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                          <span className="text-sm w-40 truncate">{t[`m${i}_title`]}</span>
                          <div className="flex-1 h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                            <div className="h-full bg-[#004030] dark:bg-[#D8C3A5]" style={{width: pct+'%'}}/>
                          </div>
                          <span className="text-xs text-slate-400 w-24 text-right shrink-0">
                            {quizDone ? t.analytics_progress_quiz_done : visited ? t.analytics_progress_visited : t.analytics_progress_not_visited}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="bg-slate-50 dark:bg-slate-900/50 rounded-xl p-6">
                  <h3 className="font-serif font-bold text-lg mb-3">{t.analytics_wp_title}</h3>
                  {weakPoints.length > 0 ? (
                    <div className="space-y-3">
                      {weakPoints.map(w => (
                        <div key={w.id} className="p-3 bg-white dark:bg-slate-800 rounded-lg">
                          <p className="text-sm font-bold">{w.name} — {w.acc}%</p>
                          {(analytics.wrongTopics[w.id]||[]).length > 0 && (
                            <p className="text-xs text-slate-500 mt-1">{t.analytics_wp_incorrect} {(analytics.wrongTopics[w.id]||[]).join('; ')}</p>
                          )}
                          <button onClick={() => goTo(w.id)} className="text-xs text-[#004030] dark:text-[#D8C3A5] underline mt-1">{t.analytics_wp_goto}</button>
                        </div>
                      ))}
                    </div>
                  ) : totalQuiz > 0 ? (
                    <p className="text-sm text-green-600 dark:text-green-400">{t.analytics_wp_allpass}</p>
                  ) : (
                    <p className="text-sm text-slate-400">{t.analytics_no_data}</p>
                  )}
                  <p className="text-xs text-slate-400 mt-4">💾 {t.analytics_wp_saved}</p>
                  <button onClick={clearHistory} className="mt-3 px-4 py-2 bg-red-500 text-white text-sm font-bold rounded-lg">{t.analytics_wp_clear}</button>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="border-b border-slate-300 dark:border-slate-600 text-left">
                        <th className="py-2 pr-4">{t.analytics_module}</th>
                        <th className="py-2 pr-4">{t.analytics_time}</th>
                        <th className="py-2 pr-4">{t.analytics_clicks}</th>
                        <th className="py-2 pr-4">{t.analytics_correct_ans_total}</th>
                        <th className="py-2 pr-4">{t.analytics_cards_read_total}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {Array.from({length:NUM_LEARN}).map((_,idx) => {
                        const i = idx+1;
                        return (
                          <tr key={i} className="border-b border-slate-100 dark:border-slate-800">
                            <td className="py-2 pr-4">{t[`m${i}_title`]}</td>
                            <td className="py-2 pr-4">{analytics.time[i]||0}{t.analytics_sec}</td>
                            <td className="py-2 pr-4">{analytics.clicks[i]||0}</td>
                            <td className="py-2 pr-4">{analytics.quizTotal[i] ? `${analytics.quizCorrect[i]}/${analytics.quizTotal[i]}` : t.analytics_no_data}</td>
                            <td className="py-2 pr-4">{analytics.cardsTotal[i] ? `${analytics.cardsRead[i]}/${analytics.cardsTotal[i]}` : t.analytics_no_data}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                <div className="bg-slate-50 dark:bg-slate-900/50 rounded-xl p-6">
                  <h3 className="font-serif font-bold text-lg mb-4">{t.analytics_form_title}</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs text-slate-500 block mb-1">{t.analytics_group}</label>
                      <select value={studentInfo.group} onChange={e=>setStudentInfo(s=>({...s, group:e.target.value}))}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent text-sm">
                        <option value="">{t.analytics_group_select}</option>
                        {t.group_options.map(g => <option key={g} value={g}>{g}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs text-slate-500 block mb-1">{t.analytics_dept}</label>
                      <input value={studentInfo.dept} onChange={e=>setStudentInfo(s=>({...s, dept:e.target.value.slice(0,20)}))} placeholder={t.analytics_dept_ph}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent text-sm" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-500 block mb-1">{t.analytics_id}</label>
                      <input value={studentInfo.id} onChange={e=>setStudentInfo(s=>({...s, id:e.target.value.replace(/[^0-9]/g,'').slice(0,12)}))} placeholder={t.analytics_id_ph}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent text-sm" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-500 block mb-1">{t.analytics_name_en}</label>
                      <input value={studentInfo.nameEn} onChange={e=>setStudentInfo(s=>({...s, nameEn:e.target.value.replace(/[<>"'&\\]/g,'').slice(0,50)}))} placeholder={t.analytics_name_en_ph}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent text-sm" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-500 block mb-1">{t.analytics_name_zh}</label>
                      <input value={studentInfo.nameZh} onChange={e=>setStudentInfo(s=>({...s, nameZh:e.target.value.replace(/[<>"'&\\]/g,'').slice(0,50)}))} placeholder={t.analytics_name_zh_ph}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent text-sm" />
                    </div>
                  </div>
                  {!canExport && <p className="text-xs text-amber-500 mt-3">{t.analytics_fill_required}</p>}
                  <button onClick={exportCSV} disabled={!canExport}
                    className="mt-4 px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">
                    {t.analytics_export_csv}
                  </button>
                </div>
              </div>
            );
          })()}

          <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700">
            <button onClick={() => goTo(Math.max(0,module-1))} disabled={module===0}
              className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg disabled:opacity-0">{t.nav_prev}</button>
            <button onClick={() => goTo(Math.min(TOTAL-1,module+1))} disabled={module===TOTAL-1}
              className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-0">{t.nav_next}</button>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3">
          <span>{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">{t.architect_name}</a></span>
          <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
